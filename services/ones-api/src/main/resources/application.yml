server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

spring:
  application:
    name: ones-api

ones:
  env: ${ONES_ENV:dev}
  app:
    base-url: ${ONES_APP_BASE_URL:}
  email:
    enabled: ${ONES_EMAIL_ENABLED:false}
    from: ${ONES_EMAIL_FROM:}
    public-base-url: ${ONES_PUBLIC_BASE_URL:${ONES_APP_BASE_URL:}}
    logo-url: ${ONES_EMAIL_LOGO_URL:}
    action-token:
      secret-name: ${ONES_EMAIL_ACTION_TOKEN_SECRET_NAME:}
      ttl-minutes: ${ONES_EMAIL_ACTION_TOKEN_TTL_MINUTES:10080}
  actuator:
    basic:
      username: ${ONES_ACTUATOR_BASIC_USERNAME:}
      password: ${ONES_ACTUATOR_BASIC_PASSWORD:}
  cdn:
    photos:
      enabled: ${ONES_CDN_PHOTOS_ENABLED:false}
      base-url: ${ONES_CDN_PHOTOS_BASE_URL:}
      signing:
        key-pair-id: ${ONES_CDN_PHOTOS_KEY_PAIR_ID:}
        private-key-secret-name: ${ONES_CDN_PHOTOS_PRIVATE_KEY_SECRET_NAME:}
      url-ttl-minutes: ${ONES_CDN_PHOTOS_URL_TTL_MINUTES:120}
      url-rounding-seconds: ${ONES_CDN_PHOTOS_URL_ROUNDING_SECONDS:300}
      social-share-ttl-days: ${ONES_CDN_PHOTOS_SOCIAL_SHARE_TTL_DAYS:7}
  internal:
    basic:
      username: ${ONES_INTERNAL_BASIC_USERNAME:}
      password: ${ONES_INTERNAL_BASIC_PASSWORD:}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  ai:
    openai:
      api-key-secret-name: ${OPENAI_API_KEY_SECRET_NAME:ones/dev/openai-api-key}
      image-model: ${OPENAI_IMAGE_MODEL:gpt-image-2}
      image-size: ${OPENAI_IMAGE_SIZE:1536x1024}
  s3:
    events:
      covers:
        temp-bucket: ${ONES_EVENTS_COVERS_TEMP_BUCKET:ones-dev-events-covers-tmp}
        final-bucket: ${ONES_EVENTS_ASSETS_BUCKET:ones-dev-events-assets}
        preview-presign-ttl-minutes: ${ONES_EVENTS_COVER_PREVIEW_PRESIGN_TTL_MINUTES:15}
        final-presign-ttl-minutes: ${ONES_EVENTS_COVER_FINAL_PRESIGN_TTL_MINUTES:15}
        reservation-ttl-minutes: ${ONES_EVENTS_COVER_RESERVATION_TTL_MINUTES:30}
      photos:
        bucket: ${ONES_EVENTS_PHOTOS_BUCKET:ones-dev-events-photos}
        put-presign-ttl-minutes: ${ONES_EVENTS_PHOTOS_PUT_PRESIGN_TTL_MINUTES:15}
        get-presign-ttl-minutes: ${ONES_EVENTS_PHOTOS_GET_PRESIGN_TTL_MINUTES:15}
  events:
    metadata:
      categories:
        - id: social_personal
          label: Eventos Sociales / Personales
          event-types:
            - id: birthday
              label: Cumpleaños
            - id: wedding
              label: Boda
            - id: baby_shower
              label: Baby shower
            - id: baptism
              label: Bautizo
            - id: first_birthday
              label: Primer año
            - id: graduation
              label: Graduación
            - id: anniversary
              label: Aniversario
            - id: bachelor_bachelorette_party
              label: Despedida de soltero/a
            - id: family_reunion
              label: Reunión familiar
            - id: themed_party
              label: Fiesta temática

        - id: academic_educational
          label: Eventos Académicos / Educativos
          event-types:
            - id: science_fair
              label: Feria de la ciencia
            - id: academic_conference
              label: Congreso académico
            - id: seminar
              label: Seminario
            - id: special_class
              label: Clase especial
            - id: institutional_event
              label: Evento institucional
            - id: university_graduation
              label: Graduación universitaria
            - id: cultural_week
              label: Semana cultural
            - id: project_expo
              label: Exposición de proyectos

        - id: public_events
          label: Eventos Públicos
          event-types:
            - id: concert
              label: Concierto
            - id: festival
              label: Festival
            - id: sports_event
              label: Evento deportivo
            - id: marathon
              label: Maratón
            - id: community_event
              label: Evento comunitario
            - id: patronal_festival
              label: Fiesta patronal
            - id: public_launch
              label: Lanzamiento público

        - id: corporate
          label: Eventos Corporativos
          event-types:
            - id: team_building
              label: Team building
            - id: annual_kickoff
              label: Kickoff anual
            - id: product_launch
              label: Lanzamiento de producto
            - id: networking
              label: Networking
            - id: business_convention
              label: Convención empresarial
            - id: corporate_party
              label: Fiesta corporativa
            - id: internal_training
              label: Capacitaciones internas

        - id: kids
          label: Eventos Infantiles
          event-types:
            - id: kids_birthday
              label: Cumpleaños infantil
            - id: school_performance
              label: Presentación escolares
            - id: childrens_day
              label: Día del niño
            - id: extracurricular_activities
              label: Actividades extracurriculares
            - id: themed_party
              label: Fiesta temática

        - id: religious_traditional
          label: Eventos Religiosos / Tradicionales
          event-types:
            - id: baptisms
              label: Bautizos
            - id: confirmations
              label: Confirmaciones
            - id: religious_weddings
              label: Matrimonios religiosos
            - id: processions
              label: Procesiones
            - id: traditional_celebrations
              label: Celebraciones tradicionales

        - id: tech_communities
          label: Eventos Tech / Comunidades
          event-types:
            - id: hackathons
              label: Hackathons
            - id: meetups
              label: Meetups
            - id: demo_day
              label: Demo Day
            - id: startup_launch
              label: Lanzamiento de startup
            - id: hybrid_webinar
              label: Webinar híbrido

        - id: arts_culture
          label: Eventos Artísticos / Culturales
          event-types:
            - id: theater_plays
              label: Obras de teatro
            - id: recitals
              label: Recitales
            - id: exhibitions
              label: Exposiciones
            - id: dance_performances
              label: Presentaciones de danza
            - id: local_cultural_events
              label: Eventos culturales locales

        - id: sports
          label: Eventos Deportivos
          event-types:
            - id: school_tournament
              label: Torneo escolar
            - id: championship
              label: Campeonato
            - id: marathon
              label: Maratón
            - id: half_marathon
              label: Media Maratón
            - id: race_5k
              label: Carrera 5K
            - id: race_10k
              label: Carrera 10K
            - id: local_competition
              label: Competencia local

        - id: everyday_micro_events
          label: Micro-eventos cotidianos
          event-types:
            - id: dinner_with_friends
              label: Cena con amigos
            - id: game_night
              label: Noche de juegos
            - id: family_picnic
              label: Picnic familiar
            - id: small_gathering
              label: Reunión pequeña
            - id: group_trip
              label: Viaje grupal
  dynamodb:
    fail-on-scan-fallback: ${ONES_DYNAMODB_FAIL_ON_SCAN_FALLBACK:true}
    table-name: ${ONES_EVENTS_TABLE:ones-events}
    users-table-name: ${ONES_USERS_TABLE:ones-users}
    invitations-table-name: ${ONES_INVITATIONS_TABLE:ones-invitations}
    cover-previews-table-name: ${ONES_COVER_PREVIEWS_TABLE:ones-cover-previews}
    cover-reservations-table-name: ${ONES_COVER_RESERVATIONS_TABLE:ones-cover-reservations}
    photos-table-name: ${ONES_PHOTOS_TABLE:ones-photos}
    photo-likes-table-name: ${ONES_DYNAMODB_PHOTO_LIKES_TABLE_NAME:ones-photo-likes}
    photo-shortlinks-table-name: ${ONES_DYNAMODB_PHOTO_SHORTLINKS_TABLE_NAME:ones-photo-shortlinks}
    preferred-names-cache-table-name: ${ONES_PREFERRED_NAMES_CACHE_TABLE:ones-preferred-names-cache}
    admins-table-name: ${ONES_ADMINS_TABLE:ones-admins}
    frames-table-name: ${ONES_FRAMES_TABLE:ones-frames}
    event-templates-table-name: ${ONES_EVENT_TEMPLATES_TABLE:ones-event-templates}
    translations-table-name: ${ONES_TRANSLATIONS_TABLE:ones-translations}
    endpoint: ${DYNAMODB_ENDPOINT:}

  photos:
    social-share-ttl-days: ${ONES_PHOTOS_SOCIAL_SHARE_TTL_DAYS:7}
  ws:
    endpoint: ${ONES_WS_ENDPOINT:}
    subscriptions-table-name: ${ONES_WS_SUBSCRIPTIONS_TABLE:ones-photos-ws-subscriptions}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:5000,http://localhost:4000,http://localhost:1234,http://localhost:7357,http://localhost:56321,http://localhost:49234,http://localhost:40233}

logging:
  level:
    org.springframework.security: INFO
