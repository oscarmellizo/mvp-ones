name: Destroy Infra (Web)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, stage, prod)'
        required: false
        default: 'dev'

permissions:
  id-token: write
  contents: read

concurrency:
  group: destroy-infra-web
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  WEB_STACK_NAME_PREFIX: ones-web

jobs:
  destroy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment + branch
        run: |
          set -euo pipefail
          envName="${{ inputs.environment }}"
          branch="${GITHUB_REF_NAME:-}"

          if [ "${envName}" = "stage" ]; then
            echo "ERROR: environment 'stage' is disabled."
            exit 1
          fi

          if [ "${envName}" = "prod" ] && [ "${branch}" != "main" ]; then
            echo "ERROR: environment 'prod' must be run from branch 'main'. Current: '${branch}'"
            exit 1
          fi

          if [ "${envName}" = "dev" ] && [ "${branch}" != "develop" ]; then
            echo "ERROR: environment 'dev' must be run from branch 'develop'. Current: '${branch}'"
            exit 1
          fi

          if [ -z "${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}" ]; then
            echo "ERROR: Missing GitHub Environment var AWS_GITHUB_OIDC_ROLE_ARN for environment '${envName}'."
            exit 1
          fi

          echo "Using role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}

      - name: Resolve stack outputs
        id: stack
        shell: bash
        run: |
          set -euo pipefail

          WEB_STACK_NAME="${WEB_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          if ! aws cloudformation describe-stacks --stack-name "${WEB_STACK_NAME}" --no-cli-pager >/dev/null 2>&1; then
            echo "stackExists=false" >> "$GITHUB_OUTPUT"
            echo "bucket=" >> "$GITHUB_OUTPUT"
            echo "distId=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "stackExists=true" >> "$GITHUB_OUTPUT"

          bucket=$(aws cloudformation describe-stacks \
            --stack-name "${WEB_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)

          distId=$(aws cloudformation describe-stacks \
            --stack-name "${WEB_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          echo "bucket=${bucket}" >> "$GITHUB_OUTPUT"
          echo "distId=${distId}" >> "$GITHUB_OUTPUT"

      - name: Empty S3 bucket
        shell: bash
        run: |
          set -euo pipefail

          WEB_STACK_NAME="${WEB_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          if [ "${{ steps.stack.outputs.stackExists }}" != "true" ]; then
            echo "Stack ${WEB_STACK_NAME} does not exist. Skipping bucket empty."
            exit 0
          fi

          bucket="${{ steps.stack.outputs.bucket }}"
          if [ -z "${bucket}" ] || [ "${bucket}" = "None" ]; then
            echo "BucketName output is empty. Skipping bucket empty."
            exit 0
          fi

          if ! aws s3api head-bucket --bucket "${bucket}" 2>/dev/null; then
            echo "Bucket ${bucket} does not exist. Skipping bucket empty."
            exit 0
          fi

          aws s3 rm "s3://${bucket}" --recursive

      - name: Delete stack
        shell: bash
        run: |
          set -euo pipefail

          WEB_STACK_NAME="${WEB_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          if ! aws cloudformation describe-stacks --stack-name "${WEB_STACK_NAME}" --no-cli-pager >/dev/null 2>&1; then
            echo "Stack ${WEB_STACK_NAME} does not exist. Nothing to delete."
            exit 0
          fi

          aws cloudformation delete-stack --stack-name "${WEB_STACK_NAME}" --no-cli-pager
          aws cloudformation wait stack-delete-complete --stack-name "${WEB_STACK_NAME}" --no-cli-pager
