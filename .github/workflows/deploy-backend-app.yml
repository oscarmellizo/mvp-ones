name: Deploy Backend App (ECR -> ECS)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, stage, prod)'
        required: false
        default: 'dev'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-app
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  BACKEND_STACK_NAME_PREFIX: ones-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}

      - name: Resolve ECR repo URI from CloudFormation outputs
        id: cfn
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          repoName="ones-${{ inputs.environment }}-ones-api"

          repoUri=$(aws cloudformation describe-stacks \
            --stack-name "${stackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue" \
            --output text)

          if [ -z "${repoUri}" ] || [ "${repoUri}" = "None" ]; then
            repoUri=$(aws ecr describe-repositories \
              --repository-names "${repoName}" \
              --query "repositories[0].repositoryUri" \
              --output text 2>/dev/null || true)
          fi

          if [ -z "${repoUri}" ] || [ "${repoUri}" = "None" ]; then
            echo "ERROR: Could not resolve ECR repo URI. CloudFormation outputs not ready and ECR repo '${repoName}' not found."
            exit 1
          fi

          clusterName=$(aws cloudformation describe-stacks \
            --stack-name "${stackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" \
            --output text)
          serviceName=$(aws cloudformation describe-stacks \
            --stack-name "${stackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceName'].OutputValue" \
            --output text)
          echo "repoUri=${repoUri}" >> $GITHUB_OUTPUT
          echo "clusterName=${clusterName}" >> $GITHUB_OUTPUT
          echo "serviceName=${serviceName}" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image (latest)
        working-directory: services/ones-api
        run: |
          docker build -t "${{ steps.cfn.outputs.repoUri }}:latest" .
          docker push "${{ steps.cfn.outputs.repoUri }}:latest"

      - name: Force new ECS deployment
        run: |
          if [ -z "${{ steps.cfn.outputs.clusterName }}" ] || [ "${{ steps.cfn.outputs.clusterName }}" = "None" ] || [ -z "${{ steps.cfn.outputs.serviceName }}" ] || [ "${{ steps.cfn.outputs.serviceName }}" = "None" ]; then
            echo "Skipping ECS update-service because ClusterName/ServiceName outputs are not available yet."
            exit 0
          fi

          aws ecs update-service \
            --cluster "${{ steps.cfn.outputs.clusterName }}" \
            --service "${{ steps.cfn.outputs.serviceName }}" \
            --desired-count 1 \
            --force-new-deployment

      - name: Show ALB URL
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          aws cloudformation describe-stacks --stack-name "${stackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='AlbUrl'].OutputValue" \
            --output text
