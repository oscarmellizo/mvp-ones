name: Deploy Infra (Web)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, stage, prod)'
        required: false
        default: 'dev'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-web
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_PREFIX: ones
  WEB_STACK_NAME_PREFIX: ones-web
  BACKEND_STACK_NAME_PREFIX: ones-backend
  CFN_PACKAGE_BUCKET_PREFIX: ones-cfn-templates

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment + branch
        run: |
          set -euo pipefail
          envName="${{ inputs.environment }}"
          branch="${GITHUB_REF_NAME:-}"

          if [ "${envName}" = "stage" ]; then
            echo "ERROR: environment 'stage' is disabled."
            exit 1
          fi

          if [ "${envName}" = "prod" ] && [ "${branch}" != "main" ]; then
            echo "ERROR: environment 'prod' must be deployed from branch 'main'. Current: '${branch}'"
            exit 1
          fi

          if [ "${envName}" = "dev" ] && [ "${branch}" != "develop" ]; then
            echo "ERROR: environment 'dev' must be deployed from branch 'develop'. Current: '${branch}'"
            exit 1
          fi

          if [ -z "${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}" ]; then
            echo "ERROR: Missing GitHub Environment var AWS_GITHUB_OIDC_ROLE_ARN for environment '${envName}'."
            exit 1
          fi

          echo "Using role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}

      - name: Deploy web stack
        id: deploy_cfn
        run: |
          set -euo pipefail

          webStackName="${WEB_STACK_NAME_PREFIX}-${{ inputs.environment }}"
          backendStackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"
          albDns=""
          if [ "${{ inputs.environment }}" = "dev" ]; then
            albDns="apidev.ones.events"
          elif [ "${{ inputs.environment }}" = "prod" ]; then
            albDns="api.ones.events"
          else
            albDns=$(aws cloudformation describe-stacks \
              --stack-name "${backendStackName}" \
              --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" \
              --output text)
          fi

          wafEnabled="${{ vars.WAF_ENABLED }}"
          if [ -z "${wafEnabled}" ]; then
            wafEnabled="true"
          fi

          shortLinksRateLimit="${{ vars.SHORTLINKS_RATE_LIMIT_PER_5MIN }}"
          if [ -z "${shortLinksRateLimit}" ]; then
            shortLinksRateLimit="2000"
          fi

          packageBucket="${CFN_PACKAGE_BUCKET_PREFIX}-${{ inputs.environment }}"
          if ! aws s3api head-bucket --bucket "${packageBucket}" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "${packageBucket}" --region "${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}"
          fi

          aws cloudformation package \
            --template-file infra/cloudformation/frontend/root.yml \
            --s3-bucket "${packageBucket}" \
            --output-template-file packaged-frontend.yml

          aws cloudformation deploy \
            --stack-name "${webStackName}" \
            --template-file packaged-frontend.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              StackPrefix="${{ vars.STACK_PREFIX != '' && vars.STACK_PREFIX || env.STACK_PREFIX }}" \
              Environment="${{ inputs.environment }}" \
              BackendAlbDnsName="${albDns}" \
              WafEnabled="${wafEnabled}" \
              ShortLinksRateLimitPer5Min="${shortLinksRateLimit}" \
              ProdAppDomainName="${{ vars.PROD_APP_DOMAIN_NAME }}" \
              ProdAcmCertificateArn="${{ vars.PROD_ACM_CERT_ARN }}"

      - name: Debug CloudFormation (on failure)
        if: ${{ steps.deploy_cfn.outcome != 'success' }}
        run: |
          webStackName="${WEB_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          echo "=== Debug CloudFormation (on failure) ==="
          echo "StackName=${webStackName}"

          echo "--- Stack events (latest) ---"
          aws cloudformation describe-stack-events \
            --stack-name "${webStackName}" \
            --max-items 40 \
            --query "StackEvents[0:40].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

          echo "--- Stack parameters (json) ---"
          aws cloudformation describe-stacks \
            --stack-name "${webStackName}" \
            --query "Stacks[0].Parameters" \
            --output json || true

      - name: Fail if CloudFormation deploy failed
        if: ${{ steps.deploy_cfn.outcome != 'success' }}
        run: |
          echo "CloudFormation deploy failed. See debug output above."
          exit 1

      - name: Show outputs
        run: |
          webStackName="${WEB_STACK_NAME_PREFIX}-${{ inputs.environment }}"
          aws cloudformation describe-stacks --stack-name "${webStackName}" \
            --query "Stacks[0].Outputs" --output table
