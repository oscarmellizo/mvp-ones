name: Deploy Infra (Bootstrap OIDC) [Validated]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, stage, prod)'
        required: false
        default: 'dev'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-bootstrap-oidc-validated
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_PREFIX: ones

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment + branch
        run: |
          set -euo pipefail
          envName="${{ inputs.environment }}"
          branch="${GITHUB_REF_NAME:-}"

          if [ "${envName}" = "stage" ]; then
            echo "ERROR: environment 'stage' is disabled."
            exit 1
          fi

          if [ "${envName}" = "prod" ] && [ "${branch}" != "main" ]; then
            echo "ERROR: environment 'prod' must be deployed from branch 'main'. Current: '${branch}'"
            exit 1
          fi

          if [ "${envName}" = "dev" ] && [ "${branch}" != "develop" ]; then
            echo "ERROR: environment 'dev' must be deployed from branch 'develop'. Current: '${branch}'"
            exit 1
          fi

          if [ -z "${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}" ]; then
            echo "ERROR: Missing GitHub Environment var AWS_GITHUB_OIDC_ROLE_ARN for environment '${envName}'."
            exit 1
          fi

          echo "Using role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}

      - name: Deploy stack (bootstrap OIDC)
        run: |
          stackName="${STACK_PREFIX}-bootstrap-oidc-${{ inputs.environment }}"
          aws cloudformation deploy \
            --stack-name "${stackName}" \
            --template-file infra/cloudformation/bootstrap-oidc.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-cli-pager

      - name: Validate stack status
        shell: bash
        run: |
          set -euo pipefail

          status=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_PREFIX}-bootstrap-oidc-${{ inputs.environment }}" \
            --query "Stacks[0].StackStatus" \
            --output text \
            --no-cli-pager)

          echo "StackStatus=${status}"

          if [ "${status}" != "CREATE_COMPLETE" ] && [ "${status}" != "UPDATE_COMPLETE" ]; then
            echo "Unexpected stack status: ${status}"
            exit 1
          fi

      - name: Validate required outputs exist
        shell: bash
        run: |
          set -euo pipefail

          roleArn=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_PREFIX}-bootstrap-oidc-${{ inputs.environment }}" \
            --query "Stacks[0].Outputs[?OutputKey=='GitHubActionsDeployRoleArn'].OutputValue" \
            --output text \
            --no-cli-pager)

          if [ -z "${roleArn}" ] || [ "${roleArn}" = "None" ]; then
            echo "Missing output GitHubActionsDeployRoleArn"
            exit 1
          fi

          echo "GitHubActionsDeployRoleArn=${roleArn}"

      - name: Show outputs
        run: |
          aws cloudformation describe-stacks --stack-name "${STACK_PREFIX}-bootstrap-oidc-${{ inputs.environment }}" \
            --query "Stacks[0].Outputs" --output table \
            --no-cli-pager
