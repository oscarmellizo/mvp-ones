name: Deploy Infra (Bootstrap OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (dev/stage/prod)
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-bootstrap-oidc
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_PREFIX: ones

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}

      - name: Deploy stack (bootstrap OIDC)
        run: |
          stackName="${STACK_PREFIX}-bootstrap-oidc-${{ inputs.environment }}"

          optionalExistingOidc=""
          if [ "${{ vars.EXISTING_OIDC_PROVIDER_ARN }}" != "" ]; then
            optionalExistingOidc="ExistingOidcProviderArn=${{ vars.EXISTING_OIDC_PROVIDER_ARN }}"
          fi

          aws cloudformation deploy \
            --stack-name "${stackName}" \
            --template-file infra/cloudformation/bootstrap-oidc.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              ${optionalExistingOidc} \
              GitHubOrg=${{ vars.GITHUB_ORG }} \
              GitHubRepo=${{ vars.GITHUB_REPO }} \
              GitHubBranch=${{ vars.GITHUB_BRANCH }} \
              RoleName=${{ vars.GITHUB_ACTIONS_ROLE_NAME }} \
            --no-cli-pager

      - name: Show outputs
        run: |
          stackName="${STACK_PREFIX}-bootstrap-oidc-${{ inputs.environment }}"
          aws cloudformation describe-stacks --stack-name "${stackName}" \
            --query "Stacks[0].Outputs" --output table \
            --no-cli-pager
