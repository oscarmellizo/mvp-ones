name: Deploy Infra (Bootstrap OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (dev/stage/prod)
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-bootstrap-oidc
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_PREFIX: ones

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743338489837:role/ones-github-actions-deploy-role-dev
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}

      - name: Deploy stack (bootstrap OIDC)
        id: deploy_cfn
        run: |
          stackName="${STACK_PREFIX}-bootstrap-oidc-${{ inputs.environment }}"

          optionalExistingOidc=""
          if [ "${{ vars.EXISTING_OIDC_PROVIDER_ARN }}" != "" ]; then
            optionalExistingOidc="ExistingOidcProviderArn=${{ vars.EXISTING_OIDC_PROVIDER_ARN }}"
          fi

          aws cloudformation deploy \
            --stack-name "${stackName}" \
            --template-file infra/cloudformation/bootstrap-oidc.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              ${optionalExistingOidc} \
              GitHubOrg=${{ vars.ONES_GH_ORG }} \
              GitHubRepo=${{ vars.ONES_GH_REPO }} \
              GitHubBranch=${{ vars.ONES_GH_BRANCH }} \
            --no-cli-pager

      - name: Debug CloudFormation (on failure)
        if: ${{ steps.deploy_cfn.outcome != 'success' }}
        run: |
          stackName="${STACK_PREFIX}-bootstrap-oidc-${{ inputs.environment }}"

          echo "--- Stack events (latest) ---"
          aws cloudformation describe-stack-events \
            --stack-name "${stackName}" \
            --max-items 30 \
            --query "StackEvents[0:30].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

          echo "--- Stack resources (if any) ---"
          aws cloudformation describe-stack-resources \
            --stack-name "${stackName}" \
            --output table || true

      - name: Fail if CloudFormation deploy failed
        if: ${{ steps.deploy_cfn.outcome != 'success' }}
        run: |
          echo "CloudFormation deploy failed. See debug output above."
          exit 1

      - name: Show outputs
        run: |
          stackName="${STACK_PREFIX}-bootstrap-oidc-${{ inputs.environment }}"
          aws cloudformation describe-stacks --stack-name "${stackName}" \
            --query "Stacks[0].Outputs" --output table \
            --no-cli-pager
