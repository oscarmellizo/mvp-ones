name: Deploy Infra (Backend)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, stage, prod)'
        required: false
        default: 'dev'
      backendDesiredCount:
        description: 'ECS desired count for ones-api service'
        required: false
        default: '0'
      usePhotoThumbnailsImage:
        description: 'Use container-image Lambda for photo thumbnails (true/false)'
        required: false
        default: 'true'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_PREFIX: ones
  BACKEND_STACK_NAME_PREFIX: ones-backend
  CFN_PACKAGE_BUCKET_PREFIX: ones-cfn-templates

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ONES_ACTUATOR_BASIC_USERNAME: ${{ secrets.ONES_ACTUATOR_BASIC_USERNAME }}
      ONES_ACTUATOR_BASIC_PASSWORD: ${{ secrets.ONES_ACTUATOR_BASIC_PASSWORD }}
      CDN_PHOTOS_ENABLED: ${{ vars.CDN_PHOTOS_ENABLED }}
      CDN_PHOTOS_SIGNING_PUBLIC_KEY_PEM_B64: ${{ secrets.CDN_PHOTOS_SIGNING_PUBLIC_KEY_PEM_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment + branch
        run: |
          set -euo pipefail
          envName="${{ inputs.environment }}"
          branch="${GITHUB_REF_NAME:-}"

          if [ "${envName}" = "stage" ]; then
            echo "ERROR: environment 'stage' is disabled."
            exit 1
          fi

          if [ "${envName}" = "prod" ] && [ "${branch}" != "main" ]; then
            echo "ERROR: environment 'prod' must be deployed from branch 'main'. Current: '${branch}'"
            exit 1
          fi

          if [ "${envName}" = "dev" ] && [ "${branch}" != "develop" ]; then
            echo "ERROR: environment 'dev' must be deployed from branch 'develop'. Current: '${branch}'"
            exit 1
          fi

          if [ -z "${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}" ]; then
            echo "ERROR: Missing GitHub Environment var AWS_GITHUB_OIDC_ROLE_ARN for environment '${envName}'."
            exit 1
          fi

          echo "Using role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}

      - name: Deploy backend stack
        id: deploy_cfn
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail

          appBaseUrl=""
          if [ "${{ inputs.environment }}" = "dev" ]; then
            appBaseUrl="https://appdev.ones.events"
          elif [ "${{ inputs.environment }}" = "stage" ]; then
            appBaseUrl="${{ vars.APP_BASE_URL_STAGE }}"
          elif [ "${{ inputs.environment }}" = "prod" ]; then
            appBaseUrl="${{ vars.APP_BASE_URL_PROD }}"
          fi

          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          cdnPublicKeyPem=""
          cdnPublicKeySsmParamName=""
          if [ -n "${CDN_PHOTOS_SIGNING_PUBLIC_KEY_PEM_B64}" ]; then
            _b64raw="${CDN_PHOTOS_SIGNING_PUBLIC_KEY_PEM_B64}"
            _b64len="${#_b64raw}"
            echo "CDN_PHOTOS_SIGNING_PUBLIC_KEY_PEM_B64 length=${_b64len} first4=${_b64raw:0:4} last4=${_b64raw: -4}"
            _b64clean="$(printf '%s' "${_b64raw}" | tr -d '[:space:]')"
            cdnPublicKeyPem="$(printf '%s' "${_b64clean}" | base64 -d | python3 -c "import sys; d=sys.stdin.read(); d=d.lstrip('\\ufeff'); d=d.replace('\\r\\n','\\n').replace('\\r','\\n'); d=d.strip(); sys.stdout.write(d)")"

            if ! printf '%s' "${cdnPublicKeyPem}" | grep -q "BEGIN PUBLIC KEY"; then
              echo "ERROR: CDN_PHOTOS_SIGNING_PUBLIC_KEY_PEM_B64 did not decode to a PEM with 'BEGIN PUBLIC KEY'."
              echo "Decoded first line:"
              printf '%s' "${cdnPublicKeyPem}" | head -n 1
              exit 1
            fi

            if ! openssl pkey -pubin -inform PEM -in <(printf '%s' "${cdnPublicKeyPem}") -noout >/dev/null 2>&1; then
              echo "ERROR: Decoded CDN public key is not parseable by openssl as a PEM public key."
              echo "Decoded first 3 lines:"
              printf '%s' "${cdnPublicKeyPem}" | head -n 3
              exit 1
            fi

            # Re-emit in canonical PEM format (guarantees proper newlines / wrapping)
            cdnPublicKeyPem="$(openssl pkey -pubin -inform PEM -in <(printf '%s' "${cdnPublicKeyPem}") -pubout)"

            cdnPublicKeySsmParamName="/${{ vars.STACK_PREFIX != '' && vars.STACK_PREFIX || env.STACK_PREFIX }}/${{ inputs.environment }}/cdn/photos/public-key-pem"
          fi

          packageBucket="${CFN_PACKAGE_BUCKET_PREFIX}-${{ inputs.environment }}"
          if ! aws s3api head-bucket --bucket "${packageBucket}" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "${packageBucket}" --region "${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}"
          fi

          cleanupZip="cleanup.zip"
          thumbnailsZip="photo-thumbnails-zip.zip"
          python3 -c "import zipfile; z=zipfile.ZipFile('cleanup.zip','w',compression=zipfile.ZIP_DEFLATED); z.write('infra/lambda/cleanup/index.py','index.py'); z.close(); z=zipfile.ZipFile('photo-thumbnails-zip.zip','w',compression=zipfile.ZIP_DEFLATED); z.write('infra/lambda/photo-thumbnails-zip/index.py','index.py'); z.close()"

          cleanupKey="lambda/cleanup/${GITHUB_SHA}.zip"
          thumbnailsKey="lambda/photo-thumbnails-zip/${GITHUB_SHA}.zip"
          aws s3 cp "${cleanupZip}" "s3://${packageBucket}/${cleanupKey}"
          aws s3 cp "${thumbnailsZip}" "s3://${packageBucket}/${thumbnailsKey}"

          aws cloudformation package \
            --template-file infra/cloudformation/backend/root.yml \
            --s3-bucket "${packageBucket}" \
            --output-template-file packaged-backend.yml

          cdnPublicKeyVersion="${CDN_PUBLIC_KEY_VERSION:-}"
          if [ -z "${cdnPublicKeyVersion}" ]; then
            existingVersion=$(aws cloudformation describe-stacks \
              --stack-name "${stackName}" \
              --query "Stacks[0].Parameters[?ParameterKey=='CdnPhotosSigningPublicKeyVersion'].ParameterValue" \
              --output text 2>/dev/null || true)
            if [ -n "${existingVersion}" ] && [ "${existingVersion}" != "None" ]; then
              cdnPublicKeyVersion="${existingVersion}"
            else
              cdnPublicKeyVersion="v1"
            fi
          fi
          echo "Using CdnPhotosSigningPublicKeyVersion=${cdnPublicKeyVersion}"

          if [ -n "${cdnPublicKeySsmParamName}" ]; then
            echo "Writing CDN public key PEM to SSM parameter: ${cdnPublicKeySsmParamName}"
            export CDN_PUBLIC_KEY_SSM_PARAM_NAME="${cdnPublicKeySsmParamName}"
            export CDN_PUBLIC_KEY_PEM="${cdnPublicKeyPem}"
            python3 -c "import json,os; name=os.environ['CDN_PUBLIC_KEY_SSM_PARAM_NAME']; v=os.environ['CDN_PUBLIC_KEY_PEM']; v=v.replace('\\r\\n','\\n').replace('\\r','\\n').rstrip(); print(json.dumps({'Name':name,'Value':v,'Type':'String','Overwrite':True}))" > ssm-put-publickey.json
            aws ssm put-parameter --cli-input-json file://ssm-put-publickey.json >/dev/null

            echo "Verifying CDN public key PEM from SSM..."
            aws ssm get-parameter --name "${cdnPublicKeySsmParamName}" --query 'Parameter.Value' --output text > ssm-publickey.pem
            echo "SSM public key line count: $(wc -l < ssm-publickey.pem | tr -d ' ')"
            echo "SSM public key first line: $(head -n 1 ssm-publickey.pem)"
            echo "SSM public key last line: $(tail -n 1 ssm-publickey.pem)"
            if ! openssl pkey -pubin -inform PEM -in ssm-publickey.pem -noout >/dev/null 2>&1; then
              echo "ERROR: SSM public key is not parseable by openssl as a PEM public key."
              echo "SSM public key first 3 lines:"
              head -n 3 ssm-publickey.pem
              exit 1
            fi

            keyInfo=$(openssl pkey -pubin -inform PEM -in ssm-publickey.pem -text -noout 2>/dev/null | head -n 2 || true)
            echo "SSM public key info: ${keyInfo}"
            if printf '%s' "${keyInfo}" | grep -q "Public-Key: ("; then
              keyBits=$(printf '%s' "${keyInfo}" | sed -n "s/.*Public-Key: (\([0-9][0-9]*\) bit).*/\1/p")
              if [ -n "${keyBits}" ] && [ "${keyBits}" != "2048" ]; then
                echo "ERROR: CloudFront PublicKey requires RSA 2048-bit keys. Detected: ${keyBits} bits."
                exit 1
              fi
            fi
          fi

          stackPrefix="${{ vars.STACK_PREFIX != '' && vars.STACK_PREFIX || env.STACK_PREFIX }}"

          usePhotoThumbnailsImage="${{ inputs.usePhotoThumbnailsImage }}"
          if [ "${usePhotoThumbnailsImage}" = "true" ]; then
            ecrRepoName="${stackPrefix}-${{ inputs.environment }}-photo-thumbnails"
            echo "Checking ECR repo ${ecrRepoName} for 'latest' image..."
            latestDigest=$(aws ecr describe-images \
              --repository-name "${ecrRepoName}" \
              --image-ids imageTag=latest \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || true)
            if [ -z "${latestDigest}" ] || [ "${latestDigest}" = "None" ]; then
              echo "WARNING: ECR repo ${ecrRepoName} has no 'latest' image. Falling back to UsePhotoThumbnailsImage=false for this deploy. Push an image first, then re-run with usePhotoThumbnailsImage=true."
              usePhotoThumbnailsImage="false"
            else
              echo "ECR 'latest' image found: ${latestDigest}"
            fi
          fi

          aws cloudformation deploy \
            --stack-name "${stackName}" \
            --template-file packaged-backend.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              StackPrefix="${stackPrefix}" \
              Environment="${{ inputs.environment }}" \
              GoogleClientId="${{ vars.GOOGLE_WEB_CLIENT_ID }}" \
              AppBaseUrl="${appBaseUrl}" \
              EmailEnabled="true" \
              EmailFrom="donotreply@ones.events" \
              EmailLogoUrl="${appBaseUrl}/assets/assets/branding/ones-logo.png" \
              PublicBaseUrl="${appBaseUrl}" \
              BackendDesiredCount="${{ inputs.backendDesiredCount }}" \
              UsePhotoThumbnailsImage="${usePhotoThumbnailsImage}" \
              CdnPhotosEnabled="${CDN_PHOTOS_ENABLED:-false}" \
              CdnPhotosSigningPublicKeyPem="" \
              CdnPhotosSigningPublicKeySsmParamName="${cdnPublicKeySsmParamName}" \
              CdnPhotosSigningPublicKeyVersion="${cdnPublicKeyVersion}" \
              LambdaArtifactsBucket="${packageBucket}" \
              CleanupFunctionS3Key="${cleanupKey}" \
              PhotoThumbnailsZipS3Key="${thumbnailsKey}" \
              PillowLayerArn="arn:aws:lambda:us-east-1:770693421928:layer:Klayers-p312-Pillow:9"

      - name: Debug CloudFormation (on failure)
        if: ${{ steps.deploy_cfn.outcome != 'success' }}
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          echo "=== Debug CloudFormation (on failure) ==="
          echo "StackName=${stackName}"

          echo "--- Stack events (latest) ---"
          aws cloudformation describe-stack-events \
            --stack-name "${stackName}" \
            --max-items 30 \
            --query "StackEvents[0:30].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

          echo "--- Stack parameters (json) ---"
          aws cloudformation describe-stacks \
            --stack-name "${stackName}" \
            --query "Stacks[0].Parameters" \
            --output json || true

          echo "--- AllStack resource lookup (json) ---"
          aws cloudformation describe-stack-resource \
            --stack-name "${stackName}" \
            --logical-resource-id AllStack \
            --output json || true

          nestedStackId=$(aws cloudformation describe-stack-resource \
            --stack-name "${stackName}" \
            --logical-resource-id AllStack \
            --query "StackResourceDetail.PhysicalResourceId" \
            --output text 2>/dev/null || true)

          echo "NestedStackId(AllStack)=${nestedStackId}"

          if [ -n "${nestedStackId}" ] && [ "${nestedStackId}" != "None" ]; then
            echo "=== Nested stack debug (AllStack) ==="
            echo "--- Nested stack events (AllStack) ---"
            aws cloudformation describe-stack-events \
              --stack-name "${nestedStackId}" \
              --max-items 60 \
              --query "StackEvents[0:60].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table || true

            echo "--- CloudFront PublicKey API diagnostics (from SSM) ---"
            stackPrefix="${{ vars.STACK_PREFIX != '' && vars.STACK_PREFIX || env.STACK_PREFIX }}"
            ssmParamName="/${stackPrefix}/${{ inputs.environment }}/cdn/photos/public-key-pem"
            if aws ssm get-parameter --name "${ssmParamName}" --query 'Parameter.Value' --output text > ssm-publickey.pem 2>/dev/null; then
              if openssl pkey -pubin -inform PEM -in ssm-publickey.pem -noout >/dev/null 2>&1; then
                diagCallerReference="diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
                diagNameRaw="diag-${stackName}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                diagName=$(printf '%s' "${diagNameRaw}" | tr -cd 'A-Za-z0-9_-')
                diagName=$(printf '%s' "${diagName}" | head -c 128)
                python3 -c "import json; print(json.dumps({'PublicKeyConfig': {'CallerReference': '${diagCallerReference}', 'Name': '${diagName}', 'EncodedKey': open('ssm-publickey.pem','r',encoding='utf-8').read(), 'Comment': 'diag'}}))" > cf-publickey-diag.json
                set +e
                createOut=$(aws cloudfront create-public-key --cli-input-json file://cf-publickey-diag.json 2>&1)
                createCode=$?
                set -e
                echo "cloudfront create-public-key exitCode=${createCode}"
                echo "${createOut}"
                if [ ${createCode} -eq 0 ]; then
                  diagId=$(printf '%s' "${createOut}" | python3 -c "import sys,json; o=json.load(sys.stdin); print(o['PublicKey']['Id'])")
                  diagEtag=$(printf '%s' "${createOut}" | python3 -c "import sys,json; o=json.load(sys.stdin); print(o['ETag'])")
                  aws cloudfront delete-public-key --id "${diagId}" --if-match "${diagEtag}" >/dev/null 2>&1 || true
                  echo "Diagnostic public key created and deleted: ${diagId}"
                fi
              else
                echo "SSM public key is not parseable by openssl; skipping CloudFront diagnostics."
              fi
            else
              echo "Could not read SSM parameter ${ssmParamName}; skipping CloudFront diagnostics."
            fi
            echo "--- Nested stack resources (AllStack) ---"
            aws cloudformation describe-stack-resources \
              --stack-name "${nestedStackId}" \
              --output table || true
          else
            echo "INFO: Could not resolve nested stack PhysicalResourceId for logical id AllStack."
          fi

          echo "--- Stack resources (if any) ---"
          aws cloudformation describe-stack-resources \
            --stack-name "${stackName}" \
            --output table || true

      - name: Fail if CloudFormation deploy failed
        if: ${{ steps.deploy_cfn.outcome != 'success' }}
        run: |
          echo "CloudFormation deploy failed. See debug output above."
          exit 1

      - name: Configure PhotoThumbnails Lambda (container image)
        if: ${{ inputs.usePhotoThumbnailsImage == 'true' }}
        id: deploy_cfn_image
        continue-on-error: true
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          appBaseUrl=""
          if [ "${{ inputs.environment }}" = "dev" ]; then
            appBaseUrl="https://appdev.ones.events"
          elif [ "${{ inputs.environment }}" = "stage" ]; then
            appBaseUrl="${{ vars.APP_BASE_URL_STAGE }}"
          elif [ "${{ inputs.environment }}" = "prod" ]; then
            appBaseUrl="${{ vars.APP_BASE_URL_PROD }}"
          fi

          cdnPublicKeyPem=""
          cdnPublicKeySsmParamName=""
          if [ -n "${CDN_PHOTOS_SIGNING_PUBLIC_KEY_PEM_B64}" ]; then
            _b64raw="${CDN_PHOTOS_SIGNING_PUBLIC_KEY_PEM_B64}"
            _b64len="${#_b64raw}"
            echo "CDN_PHOTOS_SIGNING_PUBLIC_KEY_PEM_B64 length=${_b64len} first4=${_b64raw:0:4} last4=${_b64raw: -4}"
            _b64clean="$(printf '%s' "${_b64raw}" | tr -d '[:space:]')"
            cdnPublicKeyPem="$(printf '%s' "${_b64clean}" | base64 -d | python3 -c "import sys; d=sys.stdin.read(); d=d.lstrip('\\ufeff'); d=d.replace('\\r\\n','\\n').replace('\\r','\\n'); d=d.strip(); sys.stdout.write(d)")"

            if ! printf '%s' "${cdnPublicKeyPem}" | grep -q "BEGIN PUBLIC KEY"; then
              echo "ERROR: CDN_PHOTOS_SIGNING_PUBLIC_KEY_PEM_B64 did not decode to a PEM with 'BEGIN PUBLIC KEY'."
              echo "Decoded first line:"
              printf '%s' "${cdnPublicKeyPem}" | head -n 1
              exit 1
            fi

            if ! openssl pkey -pubin -inform PEM -in <(printf '%s' "${cdnPublicKeyPem}") -noout >/dev/null 2>&1; then
              echo "ERROR: Decoded CDN public key is not parseable by openssl as a PEM public key."
              echo "Decoded first 3 lines:"
              printf '%s' "${cdnPublicKeyPem}" | head -n 3
              exit 1
            fi

            # Re-emit in canonical PEM format (guarantees proper newlines / wrapping)
            cdnPublicKeyPem="$(openssl pkey -pubin -inform PEM -in <(printf '%s' "${cdnPublicKeyPem}") -pubout)"

            cdnPublicKeySsmParamName="/${{ vars.STACK_PREFIX != '' && vars.STACK_PREFIX || env.STACK_PREFIX }}/${{ inputs.environment }}/cdn/photos/public-key-pem"
          fi

          packageBucket="${CFN_PACKAGE_BUCKET_PREFIX}-${{ inputs.environment }}"
          if ! aws s3api head-bucket --bucket "${packageBucket}" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "${packageBucket}" --region "${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}"
          fi

          cleanupZip="cleanup.zip"
          thumbnailsZip="photo-thumbnails-zip.zip"
          python3 -c "import zipfile; z=zipfile.ZipFile('cleanup.zip','w',compression=zipfile.ZIP_DEFLATED); z.write('infra/lambda/cleanup/index.py','index.py'); z.close(); z=zipfile.ZipFile('photo-thumbnails-zip.zip','w',compression=zipfile.ZIP_DEFLATED); z.write('infra/lambda/photo-thumbnails-zip/index.py','index.py'); z.close()"

          cleanupKey="lambda/cleanup/${GITHUB_SHA}.zip"
          thumbnailsKey="lambda/photo-thumbnails-zip/${GITHUB_SHA}.zip"
          aws s3 cp "${cleanupZip}" "s3://${packageBucket}/${cleanupKey}"
          aws s3 cp "${thumbnailsZip}" "s3://${packageBucket}/${thumbnailsKey}"

          repoUri=$(aws cloudformation describe-stacks \
            --stack-name "${stackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='PhotoThumbnailsEcrRepositoryUri'].OutputValue" \
            --output text)

          if [ -z "${repoUri}" ] || [ "${repoUri}" = "None" ]; then
            echo "ERROR: Could not resolve PhotoThumbnailsEcrRepositoryUri output."
            exit 1
          fi

          aws ecr get-login-password --region "${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}" | \
            docker login --username AWS --password-stdin "$(echo "${repoUri}" | cut -d'/' -f1)"

          docker build -t "${repoUri}:latest" infra/photo-thumbnails-lambda
          docker push "${repoUri}:latest"

          aws cloudformation package \
            --template-file infra/cloudformation/backend/root.yml \
            --s3-bucket "${packageBucket}" \
            --output-template-file packaged-backend.yml

          cdnPublicKeyVersion="${CDN_PUBLIC_KEY_VERSION:-}"
          if [ -z "${cdnPublicKeyVersion}" ]; then
            existingVersion=$(aws cloudformation describe-stacks \
              --stack-name "${stackName}" \
              --query "Stacks[0].Parameters[?ParameterKey=='CdnPhotosSigningPublicKeyVersion'].ParameterValue" \
              --output text 2>/dev/null || true)
            if [ -n "${existingVersion}" ] && [ "${existingVersion}" != "None" ]; then
              cdnPublicKeyVersion="${existingVersion}"
            else
              cdnPublicKeyVersion="v1"
            fi
          fi
          echo "Using CdnPhotosSigningPublicKeyVersion=${cdnPublicKeyVersion}"

          if [ -n "${cdnPublicKeySsmParamName}" ]; then
            echo "Writing CDN public key PEM to SSM parameter: ${cdnPublicKeySsmParamName}"
            export CDN_PUBLIC_KEY_SSM_PARAM_NAME="${cdnPublicKeySsmParamName}"
            export CDN_PUBLIC_KEY_PEM="${cdnPublicKeyPem}"
            python3 -c "import json,os; name=os.environ['CDN_PUBLIC_KEY_SSM_PARAM_NAME']; v=os.environ['CDN_PUBLIC_KEY_PEM']; v=v.replace('\\r\\n','\\n').replace('\\r','\\n').rstrip(); print(json.dumps({'Name':name,'Value':v,'Type':'String','Overwrite':True}))" > ssm-put-publickey.json
            aws ssm put-parameter --cli-input-json file://ssm-put-publickey.json >/dev/null

            echo "Verifying CDN public key PEM from SSM..."
            aws ssm get-parameter --name "${cdnPublicKeySsmParamName}" --query 'Parameter.Value' --output text > ssm-publickey.pem
            echo "SSM public key line count: $(wc -l < ssm-publickey.pem | tr -d ' ')"
            echo "SSM public key first line: $(head -n 1 ssm-publickey.pem)"
            echo "SSM public key last line: $(tail -n 1 ssm-publickey.pem)"
            if ! openssl pkey -pubin -inform PEM -in ssm-publickey.pem -noout >/dev/null 2>&1; then
              echo "ERROR: SSM public key is not parseable by openssl as a PEM public key."
              echo "SSM public key first 3 lines:"
              head -n 3 ssm-publickey.pem
              exit 1
            fi

            keyInfo=$(openssl pkey -pubin -inform PEM -in ssm-publickey.pem -text -noout 2>/dev/null | head -n 2 || true)
            echo "SSM public key info: ${keyInfo}"
            if printf '%s' "${keyInfo}" | grep -q "Public-Key: ("; then
              keyBits=$(printf '%s' "${keyInfo}" | sed -n "s/.*Public-Key: (\([0-9][0-9]*\) bit).*/\1/p")
              if [ -n "${keyBits}" ] && [ "${keyBits}" != "2048" ]; then
                echo "ERROR: CloudFront PublicKey requires RSA 2048-bit keys. Detected: ${keyBits} bits."
                exit 1
              fi
            fi
          fi

          stackPrefix="${{ vars.STACK_PREFIX != '' && vars.STACK_PREFIX || env.STACK_PREFIX }}"

          aws cloudformation deploy \
            --stack-name "${stackName}" \
            --template-file packaged-backend.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              StackPrefix="${stackPrefix}" \
              Environment="${{ inputs.environment }}" \
              GoogleClientId="${{ vars.GOOGLE_WEB_CLIENT_ID }}" \
              AppBaseUrl="${appBaseUrl}" \
              EmailEnabled="true" \
              EmailFrom="donotreply@ones.events" \
              EmailLogoUrl="${appBaseUrl}/assets/assets/branding/ones-logo.png" \
              PublicBaseUrl="${appBaseUrl}" \
              BackendDesiredCount="${{ inputs.backendDesiredCount }}" \
              UsePhotoThumbnailsImage="true" \
              CdnPhotosEnabled="${CDN_PHOTOS_ENABLED:-false}" \
              CdnPhotosSigningPublicKeyPem="" \
              CdnPhotosSigningPublicKeySsmParamName="${cdnPublicKeySsmParamName}" \
              CdnPhotosSigningPublicKeyVersion="${cdnPublicKeyVersion}" \
              LambdaArtifactsBucket="${packageBucket}" \
              CleanupFunctionS3Key="${cleanupKey}" \
              PhotoThumbnailsZipS3Key="${thumbnailsKey}"

      - name: Fail if CloudFormation deploy failed (final)
        if: ${{ steps.deploy_cfn.outcome != 'success' && (inputs.usePhotoThumbnailsImage != 'true' || steps.deploy_cfn_image.outcome != 'success') }}
        run: |
          echo "CloudFormation deploy failed. See debug output above."
          exit 1

      - name: Set OpenAI API key in Secrets Manager
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          secretId=$(aws cloudformation describe-stack-resource \
            --stack-name "${stackName}" \
            --logical-resource-id OpenAiApiKeySecret \
            --query "StackResourceDetail.PhysicalResourceId" \
            --output text 2>/dev/null || true)

          if [ -z "${secretId}" ] || [ "${secretId}" = "None" ]; then
            nestedStackId=$(aws cloudformation describe-stack-resource \
              --stack-name "${stackName}" \
              --logical-resource-id AllStack \
              --query "StackResourceDetail.PhysicalResourceId" \
              --output text)

            secretId=$(aws cloudformation describe-stack-resource \
              --stack-name "${nestedStackId}" \
              --logical-resource-id OpenAiApiKeySecret \
              --query "StackResourceDetail.PhysicalResourceId" \
              --output text)
          fi

          aws secretsmanager put-secret-value \
            --secret-id "${secretId}" \
            --secret-string "${OPENAI_API_KEY}" \
            --no-cli-pager

      - name: Set Actuator Basic Auth in Secrets Manager
        if: ${{ env.ONES_ACTUATOR_BASIC_USERNAME != '' && env.ONES_ACTUATOR_BASIC_PASSWORD != '' }}
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          secretId=$(aws cloudformation describe-stack-resource \
            --stack-name "${stackName}" \
            --logical-resource-id ActuatorBasicAuthSecret \
            --query "StackResourceDetail.PhysicalResourceId" \
            --output text 2>/dev/null || true)

          if [ -z "${secretId}" ] || [ "${secretId}" = "None" ]; then
            nestedStackId=$(aws cloudformation describe-stack-resource \
              --stack-name "${stackName}" \
              --logical-resource-id AllStack \
              --query "StackResourceDetail.PhysicalResourceId" \
              --output text)

            secretId=$(aws cloudformation describe-stack-resource \
              --stack-name "${nestedStackId}" \
              --logical-resource-id ActuatorBasicAuthSecret \
              --query "StackResourceDetail.PhysicalResourceId" \
              --output text)
          fi

          aws secretsmanager put-secret-value \
            --secret-id "${secretId}" \
            --secret-string "{\"username\":\"${ONES_ACTUATOR_BASIC_USERNAME}\",\"password\":\"${ONES_ACTUATOR_BASIC_PASSWORD}\"}" \
            --no-cli-pager

      - name: Show outputs
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          aws cloudformation describe-stacks --stack-name "${stackName}" \
            --query "Stacks[0].Outputs" --output table
