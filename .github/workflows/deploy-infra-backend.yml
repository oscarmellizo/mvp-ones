name: Deploy Infra (Backend)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, stage, prod)'
        required: false
        default: 'dev'
      backendDesiredCount:
        description: 'ECS desired count for ones-api service'
        required: false
        default: '0'
      usePhotoThumbnailsImage:
        description: 'Use container-image Lambda for photo thumbnails (true/false)'
        required: false
        default: 'true'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_PREFIX: ones
  BACKEND_STACK_NAME_PREFIX: ones-backend
  CFN_PACKAGE_BUCKET_PREFIX: ones-cfn-templates

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ONES_ACTUATOR_BASIC_USERNAME: ${{ secrets.ONES_ACTUATOR_BASIC_USERNAME }}
      ONES_ACTUATOR_BASIC_PASSWORD: ${{ secrets.ONES_ACTUATOR_BASIC_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}

      - name: Deploy backend stack
        id: deploy_cfn
        continue-on-error: true
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          packageBucket="${CFN_PACKAGE_BUCKET_PREFIX}-${{ inputs.environment }}"
          if ! aws s3api head-bucket --bucket "${packageBucket}" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "${packageBucket}" --region "${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}"
          fi

          cleanupZip="cleanup.zip"
          thumbnailsZip="photo-thumbnails-zip.zip"
          python - <<'PY'
          import zipfile

          def make_zip(out_name, src_path, arc_name='index.py'):
              with zipfile.ZipFile(out_name, 'w', compression=zipfile.ZIP_DEFLATED) as z:
                  z.write(src_path, arc_name)

          make_zip('cleanup.zip', 'infra/lambda/cleanup/index.py')
          make_zip('photo-thumbnails-zip.zip', 'infra/lambda/photo-thumbnails-zip/index.py')
          PY

          cleanupKey="lambda/cleanup/${GITHUB_SHA}.zip"
          thumbnailsKey="lambda/photo-thumbnails-zip/${GITHUB_SHA}.zip"
          aws s3 cp "${cleanupZip}" "s3://${packageBucket}/${cleanupKey}"
          aws s3 cp "${thumbnailsZip}" "s3://${packageBucket}/${thumbnailsKey}"

          aws cloudformation package \
            --template-file infra/cloudformation/backend/root.yml \
            --s3-bucket "${packageBucket}" \
            --output-template-file packaged-backend.yml

          aws cloudformation deploy \
            --stack-name "${stackName}" \
            --template-file packaged-backend.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              StackPrefix="${{ vars.STACK_PREFIX != '' && vars.STACK_PREFIX || env.STACK_PREFIX }}" \
              Environment="${{ inputs.environment }}" \
              GoogleClientId="${{ vars.GOOGLE_WEB_CLIENT_ID }}" \
              BackendDesiredCount="${{ inputs.backendDesiredCount }}" \
              UsePhotoThumbnailsImage="false" \
              LambdaArtifactsBucket="${packageBucket}" \
              CleanupFunctionS3Key="${cleanupKey}" \
              PhotoThumbnailsZipS3Key="${thumbnailsKey}"

      - name: Debug CloudFormation (on failure)
        if: ${{ steps.deploy_cfn.outcome != 'success' }}
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          echo "--- Stack events (latest) ---"
          aws cloudformation describe-stack-events \
            --stack-name "${stackName}" \
            --max-items 30 \
            --query "StackEvents[0:30].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

          echo "--- Stack resources (if any) ---"
          aws cloudformation describe-stack-resources \
            --stack-name "${stackName}" \
            --output table || true

      - name: Fail if CloudFormation deploy failed
        if: ${{ steps.deploy_cfn.outcome != 'success' }}
        run: |
          echo "CloudFormation deploy failed. See debug output above."
          exit 1

      - name: Configure PhotoThumbnails Lambda (container image)
        if: ${{ inputs.usePhotoThumbnailsImage == 'true' }}
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          packageBucket="${CFN_PACKAGE_BUCKET_PREFIX}-${{ inputs.environment }}"
          if ! aws s3api head-bucket --bucket "${packageBucket}" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "${packageBucket}" --region "${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}"
          fi

          cleanupZip="cleanup.zip"
          thumbnailsZip="photo-thumbnails-zip.zip"
          python - <<'PY'
          import zipfile

          def make_zip(out_name, src_path, arc_name='index.py'):
              with zipfile.ZipFile(out_name, 'w', compression=zipfile.ZIP_DEFLATED) as z:
                  z.write(src_path, arc_name)

          make_zip('cleanup.zip', 'infra/lambda/cleanup/index.py')
          make_zip('photo-thumbnails-zip.zip', 'infra/lambda/photo-thumbnails-zip/index.py')
          PY

          cleanupKey="lambda/cleanup/${GITHUB_SHA}.zip"
          thumbnailsKey="lambda/photo-thumbnails-zip/${GITHUB_SHA}.zip"
          aws s3 cp "${cleanupZip}" "s3://${packageBucket}/${cleanupKey}"
          aws s3 cp "${thumbnailsZip}" "s3://${packageBucket}/${thumbnailsKey}"

          repoUri=$(aws cloudformation describe-stacks \
            --stack-name "${stackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='PhotoThumbnailsEcrRepositoryUri'].OutputValue" \
            --output text)

          if [ -z "${repoUri}" ] || [ "${repoUri}" = "None" ]; then
            echo "ERROR: Could not resolve PhotoThumbnailsEcrRepositoryUri output."
            exit 1
          fi

          aws ecr get-login-password --region "${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}" | \
            docker login --username AWS --password-stdin "$(echo "${repoUri}" | cut -d'/' -f1)"

          docker build -t "${repoUri}:latest" infra/photo-thumbnails-lambda
          docker push "${repoUri}:latest"

          aws cloudformation package \
            --template-file infra/cloudformation/backend/root.yml \
            --s3-bucket "${packageBucket}" \
            --output-template-file packaged-backend.yml

          aws cloudformation deploy \
            --stack-name "${stackName}" \
            --template-file packaged-backend.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              StackPrefix="${{ vars.STACK_PREFIX != '' && vars.STACK_PREFIX || env.STACK_PREFIX }}" \
              Environment="${{ inputs.environment }}" \
              GoogleClientId="${{ vars.GOOGLE_WEB_CLIENT_ID }}" \
              BackendDesiredCount="${{ inputs.backendDesiredCount }}" \
              UsePhotoThumbnailsImage="true" \
              LambdaArtifactsBucket="${packageBucket}" \
              CleanupFunctionS3Key="${cleanupKey}" \
              PhotoThumbnailsZipS3Key="${thumbnailsKey}"

      - name: Set OpenAI API key in Secrets Manager
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          secretId=$(aws cloudformation describe-stack-resource \
            --stack-name "${stackName}" \
            --logical-resource-id OpenAiApiKeySecret \
            --query "StackResourceDetail.PhysicalResourceId" \
            --output text 2>/dev/null || true)

          if [ -z "${secretId}" ] || [ "${secretId}" = "None" ]; then
            nestedStackId=$(aws cloudformation describe-stack-resource \
              --stack-name "${stackName}" \
              --logical-resource-id AllStack \
              --query "StackResourceDetail.PhysicalResourceId" \
              --output text)

            secretId=$(aws cloudformation describe-stack-resource \
              --stack-name "${nestedStackId}" \
              --logical-resource-id OpenAiApiKeySecret \
              --query "StackResourceDetail.PhysicalResourceId" \
              --output text)
          fi

          aws secretsmanager put-secret-value \
            --secret-id "${secretId}" \
            --secret-string "${OPENAI_API_KEY}" \
            --no-cli-pager

      - name: Set Actuator Basic Auth in Secrets Manager
        if: ${{ env.ONES_ACTUATOR_BASIC_USERNAME != '' && env.ONES_ACTUATOR_BASIC_PASSWORD != '' }}
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          secretId=$(aws cloudformation describe-stack-resource \
            --stack-name "${stackName}" \
            --logical-resource-id ActuatorBasicAuthSecret \
            --query "StackResourceDetail.PhysicalResourceId" \
            --output text 2>/dev/null || true)

          if [ -z "${secretId}" ] || [ "${secretId}" = "None" ]; then
            nestedStackId=$(aws cloudformation describe-stack-resource \
              --stack-name "${stackName}" \
              --logical-resource-id AllStack \
              --query "StackResourceDetail.PhysicalResourceId" \
              --output text)

            secretId=$(aws cloudformation describe-stack-resource \
              --stack-name "${nestedStackId}" \
              --logical-resource-id ActuatorBasicAuthSecret \
              --query "StackResourceDetail.PhysicalResourceId" \
              --output text)
          fi

          aws secretsmanager put-secret-value \
            --secret-id "${secretId}" \
            --secret-string "{\"username\":\"${ONES_ACTUATOR_BASIC_USERNAME}\",\"password\":\"${ONES_ACTUATOR_BASIC_PASSWORD}\"}" \
            --no-cli-pager

      - name: Show outputs
        run: |
          stackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"

          aws cloudformation describe-stacks --stack-name "${stackName}" \
            --query "Stacks[0].Outputs" --output table
