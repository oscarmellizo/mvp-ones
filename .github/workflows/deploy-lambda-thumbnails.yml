name: Deploy Lambda Photo Thumbnails

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, stage, prod)'
        required: false
        default: 'dev'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lambda-thumbnails
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CFN_PACKAGE_BUCKET_PREFIX: ones-cfn-templates

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment + branch
        run: |
          set -euo pipefail
          envName="${{ inputs.environment }}"
          branch="${GITHUB_REF_NAME:-}"

          if [ "${envName}" = "stage" ]; then
            echo "ERROR: environment 'stage' is disabled."
            exit 1
          fi

          if [ "${envName}" = "prod" ] && [ "${branch}" != "main" ]; then
            echo "ERROR: environment 'prod' must be deployed from branch 'main'. Current: '${branch}'"
            exit 1
          fi

          if [ "${envName}" = "dev" ] && [ "${branch}" != "develop" ]; then
            echo "ERROR: environment 'dev' must be deployed from branch 'develop'. Current: '${branch}'"
            exit 1
          fi

          if [ -z "${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}" ]; then
            echo "ERROR: Missing GitHub Environment var AWS_GITHUB_OIDC_ROLE_ARN for environment '${envName}'."
            exit 1
          fi

          echo "Using role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}

      - name: Verify ZIP Lambda exists
        run: |
          functionName="ones-${{ inputs.environment }}-photo-thumbnails-zip"
          region="${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}"
          if ! aws lambda get-function --function-name "${functionName}" --region "${region}" >/dev/null 2>&1; then
            echo "ERROR: Lambda function not found: ${functionName}"
            echo "This environment likely uses the container-image Lambda: ones-${{ inputs.environment }}-photo-thumbnails-image"
            echo "Run the 'Deploy Lambda Photo Thumbnails (Image)' workflow (or re-deploy backend stack with usePhotoThumbnailsImage=false to create the ZIP Lambda)."
            exit 1
          fi

      - name: Create Lambda ZIP
        run: |
          cd infra/lambda/photo-thumbnails-zip
          zip -r photo-thumbnails.zip index.py

      - name: Upload ZIP to S3
        run: |
          packageBucket="${CFN_PACKAGE_BUCKET_PREFIX}-${{ inputs.environment }}"
          if ! aws s3api head-bucket --bucket "${packageBucket}" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "${packageBucket}" --region "${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}"
          fi
          thumbnailsKey="lambda/photo-thumbnails-zip/${GITHUB_SHA}.zip"
          aws s3 cp "infra/lambda/photo-thumbnails-zip/photo-thumbnails.zip" "s3://${packageBucket}/${thumbnailsKey}"
          echo "thumbnailsKey=${thumbnailsKey}" >> $GITHUB_OUTPUT

      - name: Update Lambda function code
        run: |
          packageBucket="${CFN_PACKAGE_BUCKET_PREFIX}-${{ inputs.environment }}"
          thumbnailsKey="lambda/photo-thumbnails-zip/${GITHUB_SHA}.zip"
          functionName="ones-${{ inputs.environment }}-photo-thumbnails-zip"
          
          echo "Updating Lambda function code for ${functionName}"
          aws lambda update-function-code \
            --function-name "${functionName}" \
            --s3-bucket "${packageBucket}" \
            --s3-key "${thumbnailsKey}" \
            --region "${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}"
          
          echo "Lambda function code updated successfully"

      - name: Show Lambda info
        run: |
          functionName="ones-${{ inputs.environment }}-photo-thumbnails-zip"
          aws lambda get-function-configuration --function-name "${functionName}" --region "${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}"
