name: Deploy Realtime Lambdas

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (e.g., dev)'
        required: true
        default: 'dev'
      artifactsBucket:
        description: 'S3 bucket for Lambda JARs (optional if set as secret LAMBDA_ARTIFACTS_BUCKET)'
        required: false
        default: ''
      stackPrefix:
        description: 'Stack prefix (defaults to ones) to compute STACK_NAME when not provided as secret'
        required: false
        default: 'ones'
  push:
    paths:
      - 'services/ones-realtime-lambdas/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      AWS_REGION: us-east-1
      ROLE_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME || secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
      ARTIFACTS_BUCKET: ${{ secrets.LAMBDA_ARTIFACTS_BUCKET || inputs.artifactsBucket }}
      STACK_NAME: ${{ secrets.STACK_NAME || format('{0}-backend-{1}', inputs.stackPrefix || 'ones', inputs.environment || 'dev') }}
      # Set these in the GitHub Environment (e.g., dev):
      # - AWS_ROLE_TO_ASSUME: IAM role ARN for OIDC (bootstrap-oidc.yml)
      # - LAMBDA_ARTIFACTS_BUCKET: S3 bucket to store lambda jars
      # - STACK_NAME: CloudFormation backend stack name (e.g., ones-backend-dev)
      S3_KEY: realtime/ones-realtime-lambdas-${{ github.sha }}.jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Build lambdas (shaded jar)
        run: mvn -q -DskipTests package -f services/ones-realtime-lambdas/pom.xml

      - name: Validate environment config
        run: |
          if [ -z "${{ env.ROLE_ARN }}" ]; then echo "ROLE_ARN is missing. Set AWS_ROLE_TO_ASSUME or AWS_GITHUB_OIDC_ROLE_ARN in Environment secrets."; exit 1; fi
          if [ -z "${{ env.ARTIFACTS_BUCKET }}" ]; then echo "ARTIFACTS_BUCKET is missing. Set LAMBDA_ARTIFACTS_BUCKET secret or provide 'artifactsBucket' input."; exit 1; fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload jar to S3
        run: |
          aws s3 cp services/ones-realtime-lambdas/target/ones-realtime-lambdas-0.1.0-SNAPSHOT-lambda.jar s3://${{ env.ARTIFACTS_BUCKET }}/${{ env.S3_KEY }} --only-show-errors

      - name: Deploy CloudFormation (update RealtimeLambdasJarS3Key)
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation/backend/all.yml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides RealtimeLambdasJarS3Key=${{ env.S3_KEY }}
