name: Deploy Web App (Flutter -> S3 + CloudFront)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, stage, prod)'
        required: false
        default: 'dev'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web-app
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  WEB_STACK_NAME_PREFIX: ones-web
  BACKEND_STACK_NAME_PREFIX: ones-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment + branch
        run: |
          set -euo pipefail
          envName="${{ inputs.environment }}"
          branch="${GITHUB_REF_NAME:-}"

          if [ "${envName}" = "stage" ]; then
            echo "ERROR: environment 'stage' is disabled."
            exit 1
          fi

          if [ "${envName}" = "prod" ] && [ "${branch}" != "main" ]; then
            echo "ERROR: environment 'prod' must be deployed from branch 'main'. Current: '${branch}'"
            exit 1
          fi

          if [ "${envName}" = "dev" ] && [ "${branch}" != "develop" ]; then
            echo "ERROR: environment 'dev' must be deployed from branch 'develop'. Current: '${branch}'"
            exit 1
          fi

          if [ -z "${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}" ]; then
            echo "ERROR: Missing GitHub Environment var AWS_GITHUB_OIDC_ROLE_ARN for environment '${envName}'."
            exit 1
          fi

          echo "Using role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || env.AWS_REGION }}

      - name: Resolve web outputs
        id: web
        run: |
          webStackName="${WEB_STACK_NAME_PREFIX}-${{ inputs.environment }}"
          bucket=$(aws cloudformation describe-stacks \
            --stack-name "${webStackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          distId=$(aws cloudformation describe-stacks \
            --stack-name "${webStackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          echo "bucket=${bucket}" >> $GITHUB_OUTPUT
          echo "distId=${distId}" >> $GITHUB_OUTPUT

      - name: Resolve backend ALB URL
        id: backend
        run: |
          backendStackName="${BACKEND_STACK_NAME_PREFIX}-${{ inputs.environment }}"
          albUrl=$(aws cloudformation describe-stacks \
            --stack-name "${backendStackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='AlbUrl'].OutputValue" \
            --output text)
          echo "albUrl=${albUrl}" >> $GITHUB_OUTPUT

          photosWsUrl=$(aws cloudformation describe-stacks \
            --stack-name "${backendStackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='PhotosWsUrl'].OutputValue" \
            --output text 2>/dev/null || true)
          echo "photosWsUrl=${photosWsUrl}" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        working-directory: apps/ones_app
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=ONES_ENV="${{ inputs.environment }}" \
            --dart-define=ONES_API_BASE_URL="/api" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ vars.GOOGLE_WEB_CLIENT_ID }}" \
            --dart-define=ONES_PHOTOS_WS_URL="${{ steps.backend.outputs.photosWsUrl }}"

      - name: Upload to S3
        run: |
          aws s3 sync apps/ones_app/build/web "s3://${{ steps.web.outputs.bucket }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.web.outputs.distId }}" \
            --paths "/*"

      - name: Show CloudFront URL
        run: |
          webStackName="${WEB_STACK_NAME_PREFIX}-${{ inputs.environment }}"
          aws cloudformation describe-stacks --stack-name "${webStackName}" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text
