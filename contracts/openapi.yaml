openapi: 3.0.3
info:
  title: Ones API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/events/covers/generate:
    post:
      operationId: generateEventCover
      summary: Generate an AI event cover preview and return a pre-signed URL
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateEventCoverRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateEventCoverResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/events/covers/{coverId}/accept:
    post:
      operationId: acceptEventCover
      summary: Accept a generated cover preview and obtain a reservation id for later event creation
      security:
        - bearerAuth: []
      parameters:
        - name: coverId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptEventCoverResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/invitations:
    get:
      operationId: listInvitations
      summary: List invitations for authenticated user (by email claim)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/invitations/resolve:
    get:
      operationId: resolveInvitation
      summary: Resolve an invitation token for authenticated user (returns invitation details for modal)
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/invitations/{eventId}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation for an event
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/invitations/{eventId}/reject:
    post:
      operationId: rejectInvitation
      summary: Reject an invitation for an event
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/events/covers/{coverId}/cancel:
    post:
      operationId: cancelEventCover
      summary: Cancel a generated cover preview (best-effort delete temp object)
      security:
        - bearerAuth: []
      parameters:
        - name: coverId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/events/{id}/cover-url:
    get:
      operationId: getEventCoverUrl
      summary: Get a pre-signed URL to view the event cover image (if configured)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/events:
    get:
      operationId: listEvents
      summary: List events for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createEvent
      summary: Create event for authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
              description: Resource location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/events/{id}:
    get:
      operationId: getEvent
      summary: Get event by id (only if it belongs to authenticated user)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/events/{id}/guests:
    get:
      operationId: listEventGuests
      summary: List guests for an event (owner + invitees with invitation status)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/events/{id}/guests/v2:
    get:
      operationId: listEventGuestsV2
      summary: List guests for an event including userId (when available)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuestV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/events/{eventId}/photos:
    get:
      operationId: listEventPhotos
      summary: List event photos (paginated) with optional server-side filtering
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: nextToken
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Pagination cursor returned by a previous call (opaque)
        - name: scope
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: Legacy scope parameter (kept for backward compatibility)
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, mine, shared_by_me]
            nullable: true
          description: Filter photos. all=all photos in the event, mine=photos owned by the requester, shared_by_me=photos shared by the requester
        - name: guestIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: Optional guest userIds to filter by (must be participants of the event). Can be provided as repeated query params (guestIds=a&guestIds=b)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPhotosListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/events/{id}/invitees:
    post:
      operationId: inviteEventGuests
      summary: Invite new guests to an existing event (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteEventGuestsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/translations:
    get:
      operationId: listTranslations
      summary: List translations (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: languageCode
          in: query
          required: false
          schema:
            type: string
            enum: [es, en, pt]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Translation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: upsertTranslation
      summary: Create or update a translation (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTranslationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Translation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/translations/{translationKey}/{languageCode}:
    get:
      operationId: getTranslation
      summary: Get a specific translation (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: translationKey
          in: path
          required: true
          schema:
            type: string
        - name: languageCode
          in: path
          required: true
          schema:
            type: string
            enum: [es, en, pt]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Translation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTranslation
      summary: Delete a translation (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: translationKey
          in: path
          required: true
          schema:
            type: string
        - name: languageCode
          in: path
          required: true
          schema:
            type: string
            enum: [es, en, pt]
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/translations/cache/evict:
    post:
      operationId: evictTranslationsCache
      summary: Evict translations cache (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: languageCode
          in: query
          required: false
          schema:
            type: string
            enum: [es, en, pt]
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/translations/cache/refresh:
    post:
      operationId: refreshTranslationsCache
      summary: Refresh (evict and warm) translations cache (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: languageCode
          in: query
          required: false
          schema:
            type: string
            enum: [es, en, pt]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTranslationsCacheResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    GenerateEventCoverRequest:
      type: object
      required: [eventName, objective, location]
      properties:
        eventName:
          type: string
          minLength: 1
          example: Cena en casa de Pablo
        objective:
          type: string
          minLength: 1
          example: Celebrar un cumpleaños con amigos cercanos en casa
        location:
          type: string
          minLength: 1
          example: Medellín, Colombia
        size:
          type: string
          nullable: true
          example: 512x512
    GenerateEventCoverResponse:
      type: object
      required: [coverId, previewUrl, expiresAt]
      properties:
        coverId:
          type: string
          example: 1f0b0c2d-1c8d-4c3b-b7c4-61a5f3c6a0d1
        previewUrl:
          type: string
          example: https://s3.amazonaws.com/... (pre-signed)
        expiresAt:
          type: string
          format: date-time
          example: '2026-02-19T03:00:00Z'
    AcceptEventCoverResponse:
      type: object
      required: [reservationId]
      properties:
        reservationId:
          type: string
          example: 0db0f1ad-9c44-4a2c-9c95-9348d236b0b9
    PresignedUrlResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          example: https://s3.amazonaws.com/... (pre-signed)
        expiresAt:
          type: string
          format: date-time
          example: '2026-02-19T03:00:00Z'
    CreateEventRequest:
      type: object
      required: [title, objective, location, startAt, endAt]
      properties:
        title:
          type: string
          minLength: 1
          example: Birthday Party
        objective:
          type: string
          minLength: 1
          example: Celebrar el cumpleaños con familia y amigos, con pastel y música
        location:
          type: string
          minLength: 1
          example: San Jose, CR
        startAt:
          type: string
          format: date-time
          example: '2026-02-19T01:00:00Z'
        endAt:
          type: string
          format: date-time
          example: '2026-02-19T03:00:00Z'
        coverReservationId:
          type: string
          nullable: true
          description: Reservation id obtained after accepting an AI-generated cover (optional)
          example: 0db0f1ad-9c44-4a2c-9c95-9348d236b0b9
        inviteeEmails:
          type: array
          description: Invitee emails (lowercased). For each email, an invitation is created with status 'invited'.
          items:
            type: string
            format: email
          example: ["guest1@example.com", "guest2@example.com"]
        allowGuestInvites:
          type: boolean
          description: Whether accepted guests (non-owner) are allowed to invite other guests.
          default: true

    Invitation:
      type: object
      required: [eventId, inviteeEmail, status, createdAt, updatedAt, eventTitle, eventStartAt, eventEndAt]
      properties:
        eventId:
          type: string
        inviteeEmail:
          type: string
          format: email
        inviteeUserId:
          type: string
          nullable: true
          description: The authenticated userId that last responded to this invitation (optional)
        eventOwnerId:
          type: string
        status:
          type: string
          enum: [invited, accepted, rejected]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        eventTitle:
          type: string
        eventLocation:
          type: string
          nullable: true
        eventStartAt:
          type: string
          format: date-time
        eventEndAt:
          type: string
          format: date-time
    Event:
      type: object
      required: [id, ownerId, createdAt, title, objective, location, startAt, endAt]
      properties:
        id:
          type: string
          example: 0db0f1ad-9c44-4a2c-9c95-9348d236b0b9
        ownerId:
          type: string
          example: google-oauth2|123
        createdAt:
          type: string
          format: date-time
          example: '2026-02-19T00:00:00Z'
        title:
          type: string
          example: Birthday Party
        objective:
          type: string
          example: Celebrar el cumpleaños con familia y amigos
        location:
          type: string
          example: San Jose, CR
        startAt:
          type: string
          format: date-time
          example: '2026-02-19T01:00:00Z'
        endAt:
          type: string
          format: date-time
          example: '2026-02-19T03:00:00Z'
        coverKey:
          type: string
          nullable: true
          description: S3 object key for the event cover (optional)
        allowGuestInvites:
          type: boolean
          description: Whether accepted guests (non-owner) are allowed to invite other guests.
          default: true
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: not_found
        message:
          type: string
          example: Event not found

    Guest:
      type: object
      required: [email, role, status]
      properties:
        email:
          type: string
          format: email
          nullable: true
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, guest]
        status:
          type: string
          enum: [owner, invited, accepted, rejected]

    GuestV2:
      type: object
      required: [email, role, status]
      properties:
        userId:
          type: string
          nullable: true
          description: User id if the guest has accepted and is linked to an authenticated user (or the event owner)
        email:
          type: string
          format: email
          nullable: true
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, guest]
        status:
          type: string
          enum: [owner, invited, accepted, rejected]

    EventPhotosListPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventPhotoListItem'
        nextToken:
          type: string
          nullable: true
          description: Pagination cursor (opaque). Null when there are no more results.

    EventPhotoListItem:
      type: object
      required: [photoId, createdAt, status, shared]
      properties:
        photoId:
          type: string
        guestId:
          type: string
          nullable: true
          description: Owner userId for non-shared photos
        createdAt:
          type: string
          format: date-time
        uploadedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        originalUrl:
          type: string
          nullable: true
        mediumUrl:
          type: string
          nullable: true
        smallUrl:
          type: string
          nullable: true
        shared:
          type: boolean
        ownerName:
          type: string
          nullable: true
        sharedByUserId:
          type: string
          nullable: true
        sharedByName:
          type: string
          nullable: true

    InviteEventGuestsRequest:
      type: object
      required: [inviteeEmails]
      properties:
        inviteeEmails:
          type: array
          items:
            type: string
            format: email
    Translation:
      type: object
      required: [translationKey, languageCode]
      properties:
        translationKey:
          type: string
        languageCode:
          type: string
          enum: [es, en, pt]
        value:
          type: string
          nullable: true
        context:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
    UpsertTranslationRequest:
      type: object
      required: [translationKey, languageCode, value]
      properties:
        translationKey:
          type: string
        languageCode:
          type: string
          enum: [es, en, pt]
        value:
          type: string
        context:
          type: string
          nullable: true

    RefreshTranslationsCacheResponse:
      type: object
      required: [languagesWarmed, totalTranslationsLoaded]
      properties:
        languagesWarmed:
          type: array
          items:
            type: string
            enum: [es, en, pt]
        totalTranslationsLoaded:
          type: integer
