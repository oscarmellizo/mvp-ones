<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="google-signin-client_id" content="403122779240-ahjm73ogughiivnn3o23jfsk25usmfng.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ones_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ones_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F4B64E;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }

    #splash .content {
      text-align: center;
    }

    #splash img {
      width: 380px;
      max-width: 60vw;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    #splash .subtitle {
      margin-top: 16px;
      color: #3B1D6D;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
  </style>

  <div id="splash">
    <div class="content">
      <img src="splash/symbol_purple.png" alt="Ones" />
      <div class="subtitle">Loading Experience</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (el) el.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
