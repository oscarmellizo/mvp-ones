<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Una plataforma donde tus fotos y videos de eventos están siempre accesibles, organizados y compartidos sin esfuerzo.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ones">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ones</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F4B64E;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }

    #splash .content {
      text-align: center;
    }

    #splash img {
      width: min(520px, 80vw);
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>

  <div id="splash">
    <div class="content">
      <img src="assets/assets/splash/ones-logo-grande.png" alt="Ones" />
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (el) el.remove();
    });
  </script>

  <script>
    const isAndroid = /Android/i.test(navigator.userAgent);
    const hasInvitation = new URLSearchParams(window.location.search).get('token')?.trim();
    if (window.location.hostname === 'app.ones.events' &&
        window.location.pathname === '/invitation' && isAndroid && hasInvitation) {
      window.location.replace('https://play.google.com/store/apps/details?id=com.ones.events&hl=en');
    } else {
      const flutterBootstrap = document.createElement('script');
      flutterBootstrap.src = 'flutter_bootstrap.js';
      flutterBootstrap.async = true;
      document.body.appendChild(flutterBootstrap);
    }
  </script>
</body>
</html>
