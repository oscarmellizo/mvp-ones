AWSTemplateFormatVersion: '2010-09-09'
Description: Ones MVP - Frontend CloudFront (S3 + /api proxy)

Parameters:
  StackPrefix:
    Type: String
    Default: ones

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stage
      - prod

  DevAppDomainName:
    Type: String
    Default: appdev.ones.events

  DevAcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:743338489837:certificate/bc1d3c9f-09a7-4af2-9998-3cbbf1048395

  BackendAlbDnsName:
    Type: String
    Description: DNS name of the backend ALB (without protocol)

  WebBucketName:
    Type: String

  WebBucketArn:
    Type: String

  WebBucketRegionalDomainName:
    Type: String

  WafEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  ShortLinksRateLimitPer5Min:
    Type: Number
    Default: 2000

Conditions:
  IsDev: !Equals [!Ref Environment, dev]
  WafEnabledCond: !Equals [!Ref WafEnabled, 'true']

Resources:
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafEnabledCond
    Properties:
      Name: !Sub ${AWS::StackName}-web-acl
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${AWS::StackName}-webacl
      Rules:
        - Name: AWSManagedCommonRuleSet
          Priority: 10
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: awsManagedCommon

        - Name: RateLimitShortLinks
          Priority: 20
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: rateLimited
          Statement:
            RateBasedStatement:
              Limit: !Ref ShortLinksRateLimitPer5Min
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    UriPath: {}
                  PositionalConstraint: STARTS_WITH
                  SearchString: /p/
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: shortLinksRateLimit

      CustomResponseBodies:
        rateLimited:
          ContentType: APPLICATION_JSON
          Content: '{"error":"rate_limited"}'

  ApiPathRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-api-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite /api/* to /* for ALB origin
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri && request.uri.startsWith('/api/')) {
            request.uri = request.uri.substring(4);
          } else if (request.uri === '/api') {
            request.uri = '/';
          }
          return request;
        }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        WebACLId: !If [WafEnabledCond, !GetAtt WebAcl.Arn, !Ref AWS::NoValue]
        Aliases: !If
          - IsDev
          - - !Ref DevAppDomainName
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - IsDev
          - AcmCertificateArn: !Ref DevAcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3origin
            DomainName: !Ref WebBucketRegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref OriginAccessControl
          - Id: apiorigin
            DomainName: !Ref BackendAlbDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 120
              OriginKeepaliveTimeout: 60
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: api/*
            TargetOriginId: apiorigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
                - Origin
              Cookies:
                Forward: none
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiPathRewriteFunction.FunctionARN

          - PathPattern: p/*
            TargetOriginId: apiorigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
            ForwardedValues:
              QueryString: true
              Headers:
                - Origin
              Cookies:
                Forward: none

          - PathPattern: i/*
            TargetOriginId: apiorigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
            ForwardedValues:
              QueryString: true
              Headers:
                - Origin
              Cookies:
                Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub ${WebBucketArn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  CloudFrontUrl:
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
