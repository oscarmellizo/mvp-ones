AWSTemplateFormatVersion: '2010-09-09'
Description: Ones MVP - Frontend root stack (nested)

Parameters:
  StackPrefix:
    Type: String
    Default: ones

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stage
      - prod

  BackendAlbDnsName:
    Type: String
    Description: DNS name of the backend ALB (without protocol)

  WafEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  ShortLinksRateLimitPer5Min:
    Type: Number
    Default: 2000

  ProdAppDomainName:
    Type: String
    Default: ''

  ProdAcmCertificateArn:
    Type: String
    Default: ''

Resources:
  S3Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: s3.yml
      Parameters:
        StackPrefix: !Ref StackPrefix
        Environment: !Ref Environment

  CloudFrontStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - S3Stack
    Properties:
      TemplateURL: cloudfront.yml
      Parameters:
        StackPrefix: !Ref StackPrefix
        Environment: !Ref Environment
        BackendAlbDnsName: !Ref BackendAlbDnsName
        WebBucketName: !GetAtt S3Stack.Outputs.BucketName
        WebBucketArn: !GetAtt S3Stack.Outputs.BucketArn
        WebBucketRegionalDomainName: !GetAtt S3Stack.Outputs.BucketRegionalDomainName
        WafEnabled: !Ref WafEnabled
        ShortLinksRateLimitPer5Min: !Ref ShortLinksRateLimitPer5Min
        ProdAppDomainName: !Ref ProdAppDomainName
        ProdAcmCertificateArn: !Ref ProdAcmCertificateArn

Outputs:
  CloudFrontUrl:
    Value: !GetAtt CloudFrontStack.Outputs.CloudFrontUrl
  BucketName:
    Value: !GetAtt S3Stack.Outputs.BucketName
  DistributionId:
    Value: !GetAtt CloudFrontStack.Outputs.DistributionId
