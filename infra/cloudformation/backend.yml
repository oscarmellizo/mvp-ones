AWSTemplateFormatVersion: '2010-09-09'
Description: Ones MVP - Backend stack (ECR + ECS Fargate + ALB + DynamoDB)

Parameters:
  StackPrefix:
    Type: String
    Default: ones
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  GoogleClientId:
    Type: String
    Default: CHANGE_ME
  BackendDesiredCount:
    Type: Number
    Default: 0

Resources:
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byEmail
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  InvitationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: inviteeEmail
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: inviteeEmail
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byEventId
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: inviteeEmail
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CoverPreviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: coverId
          AttributeType: S
      KeySchema:
        - AttributeName: coverId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  CoverReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reservationId
          AttributeType: S
      KeySchema:
        - AttributeName: reservationId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  EventsCoversTempBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${StackPrefix}-${Environment}-events-covers-tmp
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: delete-old-previews
            Status: Enabled
            ExpirationInDays: 1

  EventsAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${StackPrefix}-${Environment}-events-assets
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  OpenAiApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackPrefix}/${Environment}/openai-api-key
      Description: OpenAI API key for AI Event Cover generation
      SecretString: '{}'

  ActuatorBasicAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackPrefix}/${Environment}/actuator-basic-auth
      Description: Basic Auth credentials for /actuator endpoints (username/password)
      SecretString: '{"username":"","password":""}'

  PrometheusWorkspace:
    Type: AWS::APS::Workspace
    Properties:
      Alias: !Sub ${StackPrefix}-${Environment}-amp

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Sub ${AWS::Region}a
      MapPublicIpOnLaunch: true

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Sub ${AWS::Region}b
      MapPublicIpOnLaunch: true

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Service SG
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref Vpc
      TargetType: ip
      HealthCheckPath: /health
      Matcher:
        HttpCode: '200'

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Cluster:
    Type: AWS::ECS::Cluster
    Properties: {}

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ones-dynamodb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt EventsTable.Arn
                  - !Sub ${EventsTable.Arn}/index/*
                  - !GetAtt UsersTable.Arn
                  - !GetAtt InvitationsTable.Arn
                  - !Sub ${InvitationsTable.Arn}/index/*
                  - !GetAtt CoverPreviewsTable.Arn
                  - !GetAtt CoverReservationsTable.Arn
        - PolicyName: ones-s3-covers
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub ${EventsCoversTempBucket.Arn}/*
                  - !Sub ${EventsAssetsBucket.Arn}/*
        - PolicyName: ones-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref OpenAiApiKeySecret
                  - !Ref ActuatorBasicAuthSecret

        - PolicyName: ones-amp-remote-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aps:RemoteWrite
                  - aps:GetSeries
                  - aps:GetLabels
                  - aps:GetMetricMetadata
                Resource: !GetAtt PrometheusWorkspace.Arn

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${StackPrefix}-ones-api
      Cpu: '256'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: ones-api
          Image: !Sub ${EcrRepository.RepositoryUri}:latest
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: ONES_ENV
              Value: !Ref Environment
            - Name: ONES_EVENTS_TABLE
              Value: !Ref EventsTable
            - Name: ONES_USERS_TABLE
              Value: !Ref UsersTable
            - Name: ONES_INVITATIONS_TABLE
              Value: !Ref InvitationsTable
            - Name: ONES_COVER_PREVIEWS_TABLE
              Value: !Ref CoverPreviewsTable
            - Name: ONES_COVER_RESERVATIONS_TABLE
              Value: !Ref CoverReservationsTable
            - Name: ONES_EVENTS_COVERS_TEMP_BUCKET
              Value: !Ref EventsCoversTempBucket
            - Name: ONES_EVENTS_ASSETS_BUCKET
              Value: !Ref EventsAssetsBucket
            - Name: OPENAI_API_KEY_SECRET_NAME
              Value: !Sub ${StackPrefix}/${Environment}/openai-api-key
            - Name: GOOGLE_CLIENT_ID
              Value: !Ref GoogleClientId
            - Name: CORS_ALLOWED_ORIGINS
              Value: '*'
            - Name: ONES_ACTUATOR_BASIC_USERNAME
              Value: !Sub '{{resolve:secretsmanager:${ActuatorBasicAuthSecret}:SecretString:username}}'
            - Name: ONES_ACTUATOR_BASIC_PASSWORD
              Value: !Sub '{{resolve:secretsmanager:${ActuatorBasicAuthSecret}:SecretString:password}}'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

        - Name: adot-collector
          Image: public.ecr.aws/aws-observability/aws-otel-collector:latest
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: ONES_ACTUATOR_BASIC_USERNAME
              Value: !Sub '{{resolve:secretsmanager:${ActuatorBasicAuthSecret}:SecretString:username}}'
            - Name: ONES_ACTUATOR_BASIC_PASSWORD
              Value: !Sub '{{resolve:secretsmanager:${ActuatorBasicAuthSecret}:SecretString:password}}'
            - Name: AOT_CONFIG_CONTENT
              Value: !Sub |
                receivers:
                  prometheus:
                    config:
                      scrape_configs:
                        - job_name: ones-api
                          metrics_path: /actuator/prometheus
                          scheme: http
                          basic_auth:
                            username: ${!ONES_ACTUATOR_BASIC_USERNAME}
                            password: ${!ONES_ACTUATOR_BASIC_PASSWORD}
                          static_configs:
                            - targets: ["127.0.0.1:8080"]
                exporters:
                  prometheusremotewrite:
                    endpoint: https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${PrometheusWorkspace}/api/v1/remote_write
                    auth:
                      authenticator: sigv4auth
                extensions:
                  sigv4auth:
                    region: ${AWS::Region}
                    service: aps
                service:
                  extensions: [sigv4auth]
                  pipelines:
                    metrics:
                      receivers: [prometheus]
                      exporters: [prometheusremotewrite]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
    Properties:
      Cluster: !Ref Cluster
      DesiredCount: !Ref BackendDesiredCount
      HealthCheckGracePeriodSeconds: 120
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: ones-api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  AlbUrl:
    Value: !Sub http://${LoadBalancer.DNSName}
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  EventsTableName:
    Value: !Ref EventsTable
  UsersTableName:
    Value: !Ref UsersTable
  InvitationsTableName:
    Value: !Ref InvitationsTable
  CoverPreviewsTableName:
    Value: !Ref CoverPreviewsTable
  CoverReservationsTableName:
    Value: !Ref CoverReservationsTable
  EventsCoversTempBucketName:
    Value: !Ref EventsCoversTempBucket
  EventsAssetsBucketName:
    Value: !Ref EventsAssetsBucket
  OpenAiApiKeySecretName:
    Value: !Ref OpenAiApiKeySecret
  OpenAiApiKeySecretArn:
    Value: !GetAtt OpenAiApiKeySecret.Id

  ActuatorBasicAuthSecretName:
    Value: !Ref ActuatorBasicAuthSecret

  PrometheusWorkspaceId:
    Value: !Ref PrometheusWorkspace

  PrometheusWorkspaceArn:
    Value: !GetAtt PrometheusWorkspace.Arn