AWSTemplateFormatVersion: '2010-09-09'
Description: Ones MVP - Backend stack (ECR + ECS Fargate + ALB + DynamoDB)

Parameters:
  StackPrefix:
    Type: String
    Default: ones
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  GoogleClientId:
    Type: String
    Default: CHANGE_ME
  BackendDesiredCount:
    Type: Number
    Default: 0

  GrafanaDesiredCount:
    Type: Number
    Default: 1

Resources:
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byEmail
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  InvitationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-invitations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: inviteeEmail
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: inviteeEmail
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byEventId
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: inviteeEmail
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CoverPreviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-cover-previews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: coverId
          AttributeType: S
      KeySchema:
        - AttributeName: coverId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  CoverReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-cover-reservations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reservationId
          AttributeType: S
      KeySchema:
        - AttributeName: reservationId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  EventsCoversTempBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-events-covers-tmp
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: delete-old-previews
            Status: Enabled
            ExpirationInDays: 1

  EventsAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-events-assets
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  OpenAiApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackPrefix}/${Environment}/openai-api-key
      Description: OpenAI API key for AI Event Cover generation
      SecretString: '{}'

  ActuatorBasicAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackPrefix}/${Environment}/actuator-basic-auth
      Description: Basic Auth credentials for /actuator endpoints (username/password)
      SecretString: '{"username":"","password":""}'

  GrafanaAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackPrefix}/${Environment}/grafana-admin
      Description: Admin credentials for Grafana (username/password)
      SecretString: '{"username":"admin","password":"CHANGE_ME"}'

  PrometheusWorkspace:
    Type: AWS::APS::Workspace
    Properties:
      Alias: !Sub ${StackPrefix}-${Environment}-amp

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${StackPrefix}-${Environment}-ones-api
      ImageScanningConfiguration:
        ScanOnPush: true

  CleanupFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ones-backend-cleanup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub arn:aws:s3:::${EventsCoversTempBucket}
                  - !Sub arn:aws:s3:::${EventsAssetsBucket}
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub arn:aws:s3:::${EventsCoversTempBucket}/*
                  - !Sub arn:aws:s3:::${EventsAssetsBucket}/*
              - Effect: Allow
                Action:
                  - ecr:ListImages
                  - ecr:BatchDeleteImage
                Resource: !GetAtt EcrRepository.Arn

  CleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt CleanupFunctionRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request

          s3 = boto3.client('s3')
          ecr = boto3.client('ecr')

          def _send(event, context, status, data=None, reason=None, physical_id=None):
              response_url = event['ResponseURL']
              body = {
                  'Status': status,
                  'Reason': reason or ('See CloudWatch Log Stream: ' + context.log_stream_name),
                  'PhysicalResourceId': physical_id or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {},
              }
              req = urllib.request.Request(
                  response_url,
                  data=json.dumps(body).encode('utf-8'),
                  method='PUT',
                  headers={'content-type': ''}
              )
              with urllib.request.urlopen(req) as f:
                  f.read()

          def _empty_bucket(bucket):
              versioning = s3.get_bucket_versioning(Bucket=bucket).get('Status') == 'Enabled'
              if versioning:
                  paginator = s3.get_paginator('list_object_versions')
                  for page in paginator.paginate(Bucket=bucket):
                      to_delete = []
                      for v in page.get('Versions', []):
                          to_delete.append({'Key': v['Key'], 'VersionId': v['VersionId']})
                      for v in page.get('DeleteMarkers', []):
                          to_delete.append({'Key': v['Key'], 'VersionId': v['VersionId']})
                      if to_delete:
                          s3.delete_objects(Bucket=bucket, Delete={'Objects': to_delete, 'Quiet': True})
              else:
                  paginator = s3.get_paginator('list_objects_v2')
                  for page in paginator.paginate(Bucket=bucket):
                      objs = [{'Key': o['Key']} for o in page.get('Contents', [])]
                      if objs:
                          s3.delete_objects(Bucket=bucket, Delete={'Objects': objs, 'Quiet': True})

          def _delete_all_ecr_images(repo_name):
              paginator = ecr.get_paginator('list_images')
              for page in paginator.paginate(repositoryName=repo_name, filter={'tagStatus': 'ANY'}):
                  ids = page.get('imageIds', [])
                  if ids:
                      ecr.batch_delete_image(repositoryName=repo_name, imageIds=ids)

          def handler(event, context):
              try:
                  props = event.get('ResourceProperties', {})
                  buckets = props.get('Buckets', [])
                  repo = props.get('EcrRepositoryName', '')

                  if event.get('RequestType') == 'Delete':
                      for b in buckets:
                          _empty_bucket(b)
                      if repo:
                          _delete_all_ecr_images(repo)

                  _send(event, context, 'SUCCESS', data={'Cleaned': 'true'})
              except Exception as e:
                  _send(event, context, 'FAILED', reason=str(e))

  CleanupOnDelete:
    Type: Custom::CleanupOnDelete
    Properties:
      ServiceToken: !GetAtt CleanupFunction.Arn
      Buckets:
        - !Ref EventsCoversTempBucket
        - !Ref EventsAssetsBucket
      EcrRepositoryName: !Ref EcrRepository

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Sub ${AWS::Region}a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Sub ${AWS::Region}b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-public-b

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-alb-sg

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Service SG
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-svc-sg

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref Vpc
      TargetType: ip
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-tg

  GrafanaTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref Vpc
      TargetType: ip
      HealthCheckPath: /api/health
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-grafana-tg

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  GrafanaListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /grafana
              - /grafana/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GrafanaTargetGroup

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${StackPrefix}-${Environment}-cluster

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ones-secrets-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref OpenAiApiKeySecret
                  - !Ref ActuatorBasicAuthSecret
                  - !Ref GrafanaAdminSecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ones-dynamodb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt EventsTable.Arn
                  - !Sub ${EventsTable.Arn}/index/*
                  - !GetAtt UsersTable.Arn
                  - !GetAtt InvitationsTable.Arn
                  - !Sub ${InvitationsTable.Arn}/index/*
                  - !GetAtt CoverPreviewsTable.Arn
                  - !GetAtt CoverReservationsTable.Arn
        - PolicyName: ones-s3-covers
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub ${EventsCoversTempBucket.Arn}/*
                  - !Sub ${EventsAssetsBucket.Arn}/*
        - PolicyName: ones-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref OpenAiApiKeySecret
                  - !Ref ActuatorBasicAuthSecret

        - PolicyName: ones-amp-remote-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aps:RemoteWrite
                  - aps:GetSeries
                  - aps:GetLabels
                  - aps:GetMetricMetadata
                Resource: !GetAtt PrometheusWorkspace.Arn

  GrafanaTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: grafana-amp-query
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aps:QueryMetrics
                  - aps:GetSeries
                  - aps:GetLabels
                  - aps:GetMetricMetadata
                Resource: !GetAtt PrometheusWorkspace.Arn

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${StackPrefix}/${Environment}/ones-api
      RetentionInDays: 7

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${StackPrefix}-${Environment}-ones-api
      Cpu: '256'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: ones-api
          Image: !Sub ${EcrRepository.RepositoryUri}:latest
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Secrets:
            - Name: ONES_ACTUATOR_BASIC_USERNAME
              ValueFrom: !Sub '${ActuatorBasicAuthSecret}:username::'
            - Name: ONES_ACTUATOR_BASIC_PASSWORD
              ValueFrom: !Sub '${ActuatorBasicAuthSecret}:password::'
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: ONES_ENV
              Value: !Ref Environment
            - Name: ONES_EVENTS_TABLE
              Value: !Ref EventsTable
            - Name: ONES_USERS_TABLE
              Value: !Ref UsersTable
            - Name: ONES_INVITATIONS_TABLE
              Value: !Ref InvitationsTable
            - Name: ONES_COVER_PREVIEWS_TABLE
              Value: !Ref CoverPreviewsTable
            - Name: ONES_COVER_RESERVATIONS_TABLE
              Value: !Ref CoverReservationsTable
            - Name: ONES_EVENTS_COVERS_TEMP_BUCKET
              Value: !Ref EventsCoversTempBucket
            - Name: ONES_EVENTS_ASSETS_BUCKET
              Value: !Ref EventsAssetsBucket
            - Name: OPENAI_API_KEY_SECRET_NAME
              Value: !Sub ${StackPrefix}/${Environment}/openai-api-key
            - Name: GOOGLE_CLIENT_ID
              Value: !Ref GoogleClientId
            - Name: CORS_ALLOWED_ORIGINS
              Value: '*'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

        - Name: adot-collector
          Image: public.ecr.aws/aws-observability/aws-otel-collector:latest
          Secrets:
            - Name: ONES_ACTUATOR_BASIC_USERNAME
              ValueFrom: !Sub '${ActuatorBasicAuthSecret}:username::'
            - Name: ONES_ACTUATOR_BASIC_PASSWORD
              ValueFrom: !Sub '${ActuatorBasicAuthSecret}:password::'
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AOT_CONFIG_CONTENT
              Value: !Sub |
                receivers:
                  prometheus:
                    config:
                      scrape_configs:
                        - job_name: ones-api
                          metrics_path: /actuator/prometheus
                          scheme: http
                          basic_auth:
                            username: ${!ONES_ACTUATOR_BASIC_USERNAME}
                            password: ${!ONES_ACTUATOR_BASIC_PASSWORD}
                          static_configs:
                            - targets: ["127.0.0.1:8080"]
                exporters:
                  prometheusremotewrite:
                    endpoint: https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${PrometheusWorkspace.WorkspaceId}/api/v1/remote_write
                    auth:
                      authenticator: sigv4auth
                extensions:
                  sigv4auth:
                    region: ${AWS::Region}
                    service: aps
                service:
                  extensions: [sigv4auth]
                  pipelines:
                    metrics:
                      receivers: [prometheus]
                      exporters: [prometheusremotewrite]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  GrafanaTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${StackPrefix}-${Environment}-grafana
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt GrafanaTaskRole.Arn
      ContainerDefinitions:
        - Name: grafana
          Image: grafana/grafana:11.0.0
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Secrets:
            - Name: GF_SECURITY_ADMIN_USER
              ValueFrom: !Sub '${GrafanaAdminSecret}:username::'
            - Name: GF_SECURITY_ADMIN_PASSWORD
              ValueFrom: !Sub '${GrafanaAdminSecret}:password::'
          Environment:
            - Name: GF_SERVER_ROOT_URL
              Value: !Sub http://${LoadBalancer.DNSName}/grafana/
            - Name: GF_SERVER_SERVE_FROM_SUB_PATH
              Value: 'true'
          Command:
            - /bin/sh
            - -ec
            - !Sub |
              mkdir -p /etc/grafana/provisioning/datasources
              cat > /etc/grafana/provisioning/datasources/amp.yaml <<'EOF'
              apiVersion: 1
              datasources:
                - name: AMP
                  type: prometheus
                  access: proxy
                  url: https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${PrometheusWorkspace.WorkspaceId}
                  isDefault: true
                  jsonData:
                    httpMethod: POST
                    sigV4Auth: true
                    sigV4Region: ${AWS::Region}
                    sigV4Service: aps
              EOF
              /run.sh
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
    Properties:
      ServiceName: !Sub ${StackPrefix}-${Environment}-ones-api
      Cluster: !Ref Cluster
      DesiredCount: !Ref BackendDesiredCount
      HealthCheckGracePeriodSeconds: 120
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: ones-api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  GrafanaService:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
      - GrafanaListenerRule
    Properties:
      ServiceName: !Sub ${StackPrefix}-${Environment}-grafana
      Cluster: !Ref Cluster
      DesiredCount: !Ref GrafanaDesiredCount
      HealthCheckGracePeriodSeconds: 120
      LaunchType: FARGATE
      TaskDefinition: !Ref GrafanaTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: grafana
          ContainerPort: 3000
          TargetGroupArn: !Ref GrafanaTargetGroup

Outputs:
  AlbUrl:
    Value: !Sub http://${LoadBalancer.DNSName}
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  GrafanaUrl:
    Value: !Sub http://${LoadBalancer.DNSName}/grafana/
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  EventsTableName:
    Value: !Ref EventsTable
  UsersTableName:
    Value: !Ref UsersTable
  InvitationsTableName:
    Value: !Ref InvitationsTable
  CoverPreviewsTableName:
    Value: !Ref CoverPreviewsTable
  CoverReservationsTableName:
    Value: !Ref CoverReservationsTable
  EventsCoversTempBucketName:
    Value: !Ref EventsCoversTempBucket
  EventsAssetsBucketName:
    Value: !Ref EventsAssetsBucket
  OpenAiApiKeySecretName:
    Value: !Ref OpenAiApiKeySecret
  OpenAiApiKeySecretArn:
    Value: !GetAtt OpenAiApiKeySecret.Id

  ActuatorBasicAuthSecretName:
    Value: !Ref ActuatorBasicAuthSecret

  PrometheusWorkspaceId:
    Value: !GetAtt PrometheusWorkspace.WorkspaceId
  PrometheusWorkspaceArn:
    Value: !GetAtt PrometheusWorkspace.Arn