AWSTemplateFormatVersion: '2010-09-09'
Description: Ones MVP - Backend root stack (nested)

Parameters:
  StackPrefix:
    Type: String
    Default: ones

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stage
      - prod

  GoogleClientId:
    Type: String
    Default: ''
  FirebaseProjectId:
    Type: String
    Default: ''
  ApiPublicBaseUrl:
    Type: String
    Default: ''
  GoogleLegacyAuthEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  AppBaseUrl:
    Type: String
    Default: ''

  MercadoPagoTestPayerEmail:
    Type: String
    Default: ''

  ApiAcmCertificateArn:
    Type: String
    Default: ''

  # Email invitations (SES)
  EmailEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  EmailFrom:
    Type: String
    Default: donotreply@ones.events

  EmailLogoUrl:
    Type: String
    Default: ''

  PublicBaseUrl:
    Type: String
    Default: ''

  BackendDesiredCount:
    Type: Number
    Default: 0

  BackendMinCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 50

  BackendMaxCapacity:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100

  UsePhotoThumbnailsImage:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  PhotoThumbnailsMaxConcurrency:
    Type: Number
    Default: 1000
    MinValue: 2
    MaxValue: 1000

  PhotoThumbnailsMaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000

  PhotoThumbnailsInitialRetryDelaySeconds:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 900

  PhotoThumbnailsMaxRetryDelaySeconds:
    Type: Number
    Default: 300
    MinValue: 1
    MaxValue: 900

  PhotoDateResolverEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  PhotoDateResolverMaxConcurrency:
    Type: Number
    Default: 10
    MinValue: 2
    MaxValue: 1000

  PhotoDateResolverMaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000

  PhotoDateResolverModelId:
    Type: String
    Default: amazon.nova-micro-v1:0

  PhotoDateResolverCacheTtlSeconds:
    Type: Number
    Default: 2592000
    MinValue: 60

  PhotoDateResolverMonthlyBudgetUsd:
    Type: Number
    Default: 20
    MinValue: 1

  PhotoDateResolverZipS3Key:
    Type: String
    Default: ''

  TournamentScoringWorkerZipS3Key:
    Type: String
    Default: ''

  TournamentScoringMaxConcurrency:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 1000

  GrafanaDesiredCount:
    Type: Number
    Default: 1

  # CDN Configuration
  CdnPhotosEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CdnPhotosSigningPublicKeyPem:
    Type: String
    Default: ''

  CdnPhotosSigningPublicKeySsmParamName:
    Type: String
    Default: ''

  CdnPhotosSigningPublicKeyVersion:
    Type: String
    Default: v1

  LambdaArtifactsBucket:
    Type: String
    Default: ''

  CleanupFunctionS3Key:
    Type: String
    Default: ''

  PhotoThumbnailsZipS3Key:
    Type: String
    Default: ''

  # Realtime Lambdas (Java) shaded JAR key in the artifacts bucket
  RealtimeLambdasJarS3Key:
    Type: String
    Default: ''

Resources:
  AllStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: all.yml
      Parameters:
        StackPrefix: !Ref StackPrefix
        Environment: !Ref Environment
        GoogleClientId: !Ref GoogleClientId
        FirebaseProjectId: !Ref FirebaseProjectId
        ApiPublicBaseUrl: !Ref ApiPublicBaseUrl
        GoogleLegacyAuthEnabled: !Ref GoogleLegacyAuthEnabled
        AppBaseUrl: !Ref AppBaseUrl
        MercadoPagoTestPayerEmail: !Ref MercadoPagoTestPayerEmail
        ApiAcmCertificateArn: !Ref ApiAcmCertificateArn
        EmailEnabled: !Ref EmailEnabled
        EmailFrom: !Ref EmailFrom
        EmailLogoUrl: !Ref EmailLogoUrl
        PublicBaseUrl: !Ref PublicBaseUrl
        BackendDesiredCount: !Ref BackendDesiredCount
        BackendMinCapacity: !Ref BackendMinCapacity
        BackendMaxCapacity: !Ref BackendMaxCapacity
        UsePhotoThumbnailsImage: !Ref UsePhotoThumbnailsImage
        PhotoThumbnailsMaxConcurrency: !Ref PhotoThumbnailsMaxConcurrency
        PhotoThumbnailsMaxReceiveCount: !Ref PhotoThumbnailsMaxReceiveCount
        PhotoThumbnailsInitialRetryDelaySeconds: !Ref PhotoThumbnailsInitialRetryDelaySeconds
        PhotoThumbnailsMaxRetryDelaySeconds: !Ref PhotoThumbnailsMaxRetryDelaySeconds
        PhotoDateResolverEnabled: !Ref PhotoDateResolverEnabled
        PhotoDateResolverMaxConcurrency: !Ref PhotoDateResolverMaxConcurrency
        PhotoDateResolverMaxReceiveCount: !Ref PhotoDateResolverMaxReceiveCount
        PhotoDateResolverModelId: !Ref PhotoDateResolverModelId
        PhotoDateResolverCacheTtlSeconds: !Ref PhotoDateResolverCacheTtlSeconds
        PhotoDateResolverMonthlyBudgetUsd: !Ref PhotoDateResolverMonthlyBudgetUsd
        PhotoDateResolverZipS3Key: !Ref PhotoDateResolverZipS3Key
        TournamentScoringWorkerZipS3Key: !Ref TournamentScoringWorkerZipS3Key
        TournamentScoringMaxConcurrency: !Ref TournamentScoringMaxConcurrency
        GrafanaDesiredCount: !Ref GrafanaDesiredCount
        CdnPhotosEnabled: !Ref CdnPhotosEnabled
        CdnPhotosSigningPublicKeyPem: !Ref CdnPhotosSigningPublicKeyPem
        CdnPhotosSigningPublicKeySsmParamName: !Ref CdnPhotosSigningPublicKeySsmParamName
        CdnPhotosSigningPublicKeyVersion: !Ref CdnPhotosSigningPublicKeyVersion
        LambdaArtifactsBucket: !Ref LambdaArtifactsBucket
        CleanupFunctionS3Key: !Ref CleanupFunctionS3Key
        PhotoThumbnailsZipS3Key: !Ref PhotoThumbnailsZipS3Key
        RealtimeLambdasJarS3Key: !Ref RealtimeLambdasJarS3Key

Outputs:
  AlbUrl:
    Value: !GetAtt AllStack.Outputs.AlbUrl
  AlbDnsName:
    Value: !GetAtt AllStack.Outputs.AlbDnsName
  PhotosWsUrl:
    Value: !GetAtt AllStack.Outputs.PhotosWsUrl
  GrafanaUrl:
    Value: !GetAtt AllStack.Outputs.GrafanaUrl
  EcrRepositoryUri:
    Value: !GetAtt AllStack.Outputs.EcrRepositoryUri
  PhotoThumbnailsEcrRepositoryUri:
    Value: !GetAtt AllStack.Outputs.PhotoThumbnailsEcrRepositoryUri
  ClusterName:
    Value: !GetAtt AllStack.Outputs.ClusterName
  ServiceName:
    Value: !GetAtt AllStack.Outputs.ServiceName
  EventsTableName:
    Value: !GetAtt AllStack.Outputs.EventsTableName
  UsersTableName:
    Value: !GetAtt AllStack.Outputs.UsersTableName
  InvitationsTableName:
    Value: !GetAtt AllStack.Outputs.InvitationsTableName
  CoverPreviewsTableName:
    Value: !GetAtt AllStack.Outputs.CoverPreviewsTableName
  CoverReservationsTableName:
    Value: !GetAtt AllStack.Outputs.CoverReservationsTableName
  PhotosTableName:
    Value: !GetAtt AllStack.Outputs.PhotosTableName
  PhotoLikesTableName:
    Value: !GetAtt AllStack.Outputs.PhotoLikesTableName
  PreferredNamesCacheTableName:
    Value: !GetAtt AllStack.Outputs.PreferredNamesCacheTableName
  AdminsTableName:
    Value: !GetAtt AllStack.Outputs.AdminsTableName
  FramesTableName:
    Value: !GetAtt AllStack.Outputs.FramesTableName
  EventTemplatesTableName:
    Value: !GetAtt AllStack.Outputs.EventTemplatesTableName
  EventsCoversTempBucketName:
    Value: !GetAtt AllStack.Outputs.EventsCoversTempBucketName
  EventsAssetsBucketName:
    Value: !GetAtt AllStack.Outputs.EventsAssetsBucketName
  EventsPhotosBucketName:
    Value: !GetAtt AllStack.Outputs.EventsPhotosBucketName
  OpenAiApiKeySecretName:
    Value: !GetAtt AllStack.Outputs.OpenAiApiKeySecretName

  ActuatorBasicAuthSecretName:
    Value: !GetAtt AllStack.Outputs.ActuatorBasicAuthSecretName

  InternalBasicAuthSecretName:
    Value: !GetAtt AllStack.Outputs.InternalBasicAuthSecretName

  AlertsTopicArn:
    Value: !GetAtt AllStack.Outputs.AlertsTopicArn

  PrometheusWorkspaceId:
    Value: !GetAtt AllStack.Outputs.PrometheusWorkspaceId

  PrometheusWorkspaceArn:
    Value: !GetAtt AllStack.Outputs.PrometheusWorkspaceArn
