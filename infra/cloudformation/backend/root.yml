AWSTemplateFormatVersion: '2010-09-09'
Description: Ones MVP - Backend root stack (nested)

Parameters:
  StackPrefix:
    Type: String
    Default: ones

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stage
      - prod

  GoogleClientId:
    Type: String
    Default: CHANGE_ME

  BackendDesiredCount:
    Type: Number
    Default: 0

  UsePhotoThumbnailsImage:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  GrafanaDesiredCount:
    Type: Number
    Default: 1

  # CDN Configuration
  CdnPhotosEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CdnPhotosSigningPublicKeyPem:
    Type: String
    Default: ''

  CdnPhotosSigningPublicKeyVersion:
    Type: String
    Default: v1

  LambdaArtifactsBucket:
    Type: String
    Default: ''

  CleanupFunctionS3Key:
    Type: String
    Default: ''

  PhotoThumbnailsZipS3Key:
    Type: String
    Default: ''

Resources:
  AllStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: all.yml
      Parameters:
        StackPrefix: !Ref StackPrefix
        Environment: !Ref Environment
        GoogleClientId: !Ref GoogleClientId
        BackendDesiredCount: !Ref BackendDesiredCount
        UsePhotoThumbnailsImage: !Ref UsePhotoThumbnailsImage
        GrafanaDesiredCount: !Ref GrafanaDesiredCount
        CdnPhotosEnabled: !Ref CdnPhotosEnabled
        CdnPhotosSigningPublicKeyPem: !Ref CdnPhotosSigningPublicKeyPem
        CdnPhotosSigningPublicKeyVersion: !Ref CdnPhotosSigningPublicKeyVersion
        LambdaArtifactsBucket: !Ref LambdaArtifactsBucket
        CleanupFunctionS3Key: !Ref CleanupFunctionS3Key
        PhotoThumbnailsZipS3Key: !Ref PhotoThumbnailsZipS3Key

Outputs:
  AlbUrl:
    Value: !GetAtt AllStack.Outputs.AlbUrl
  AlbDnsName:
    Value: !GetAtt AllStack.Outputs.AlbDnsName
  GrafanaUrl:
    Value: !GetAtt AllStack.Outputs.GrafanaUrl
  EcrRepositoryUri:
    Value: !GetAtt AllStack.Outputs.EcrRepositoryUri
  PhotoThumbnailsEcrRepositoryUri:
    Value: !GetAtt AllStack.Outputs.PhotoThumbnailsEcrRepositoryUri
  ClusterName:
    Value: !GetAtt AllStack.Outputs.ClusterName
  ServiceName:
    Value: !GetAtt AllStack.Outputs.ServiceName
  EventsTableName:
    Value: !GetAtt AllStack.Outputs.EventsTableName
  UsersTableName:
    Value: !GetAtt AllStack.Outputs.UsersTableName
  InvitationsTableName:
    Value: !GetAtt AllStack.Outputs.InvitationsTableName
  CoverPreviewsTableName:
    Value: !GetAtt AllStack.Outputs.CoverPreviewsTableName
  CoverReservationsTableName:
    Value: !GetAtt AllStack.Outputs.CoverReservationsTableName
  PhotosTableName:
    Value: !GetAtt AllStack.Outputs.PhotosTableName
  PhotoLikesTableName:
    Value: !GetAtt AllStack.Outputs.PhotoLikesTableName
  PreferredNamesCacheTableName:
    Value: !GetAtt AllStack.Outputs.PreferredNamesCacheTableName
  AdminsTableName:
    Value: !GetAtt AllStack.Outputs.AdminsTableName
  FramesTableName:
    Value: !GetAtt AllStack.Outputs.FramesTableName
  EventTemplatesTableName:
    Value: !GetAtt AllStack.Outputs.EventTemplatesTableName
  EventsCoversTempBucketName:
    Value: !GetAtt AllStack.Outputs.EventsCoversTempBucketName
  EventsAssetsBucketName:
    Value: !GetAtt AllStack.Outputs.EventsAssetsBucketName
  EventsPhotosBucketName:
    Value: !GetAtt AllStack.Outputs.EventsPhotosBucketName
  OpenAiApiKeySecretName:
    Value: !GetAtt AllStack.Outputs.OpenAiApiKeySecretName
