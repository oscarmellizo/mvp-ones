  PhotosWebSocketHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackPrefix}-${Environment}-photos-ws-handler-role
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ones-photos-ws-ddb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt PhotosWsConnectionsTable.Arn
                  - !GetAtt PhotosWsSubscriptionsTable.Arn
                  - !Sub ${PhotosWsSubscriptionsTable.Arn}/index/*

  PhotosWebSocketHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${StackPrefix}-${Environment}-photos-ws-handler
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Role: !GetAtt PhotosWebSocketHandlerRole.Arn
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref PhotosWsConnectionsTable
          SUBSCRIPTIONS_TABLE: !Ref PhotosWsSubscriptionsTable
          TTL_SECONDS: '86400'
          BACKEND_BASE_URL: !Sub http://${LoadBalancer.DNSName}
      Code:
        ZipFile: |
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          import boto3
          from boto3.dynamodb.conditions import Key

          ddb = boto3.resource('dynamodb')
          conn_table = ddb.Table(os.environ['CONNECTIONS_TABLE'])
          sub_table = ddb.Table(os.environ['SUBSCRIPTIONS_TABLE'])

          TTL_SECONDS = int(os.environ.get('TTL_SECONDS', '86400'))
          BACKEND_BASE_URL = (os.environ.get('BACKEND_BASE_URL') or '').rstrip('/')

          def _resp(code: int, body: str = ''):
              return {"statusCode": code, "body": body}

          def _token_from_event(event: dict):
              q = event.get('queryStringParameters') or {}
              tok = (q.get('token') or '').strip()
              if tok:
                  return tok
              headers = event.get('headers') or {}
              auth = (headers.get('Authorization') or headers.get('authorization') or '').strip()
              if auth.lower().startswith('bearer '):
                  return auth[7:].strip()
              return ''

          def _now_ttl():
              return int(time.time()) + TTL_SECONDS

          def _disconnect_cleanup(connection_id: str):
              if not connection_id:
                  return
              conn_table.delete_item(Key={'connectionId': connection_id})
              try:
                  last_key = None
                  while True:
                      args = {
                          'IndexName': 'byConnectionId',
                          'KeyConditionExpression': Key('connectionId').eq(connection_id),
                          'Limit': 100,
                      }
                      if last_key:
                          args['ExclusiveStartKey'] = last_key
                      res = sub_table.query(**args)
                      items = res.get('Items') or []
                      for it in items:
                          eid = it.get('eventId')
                          cid = it.get('connectionId')
                          if eid and cid:
                              sub_table.delete_item(Key={'eventId': eid, 'connectionId': cid})
                      last_key = res.get('LastEvaluatedKey')
                      if not last_key:
                          break
              except Exception:
                  return

          def _authorized_for_event(event_id: str, token: str) -> bool:
              if not BACKEND_BASE_URL:
                  return False
              if not event_id or not token:
                  return False
              url = f"{BACKEND_BASE_URL}/v1/events/{urllib.parse.quote(event_id)}"
              req = urllib.request.Request(url, method='GET')
              req.add_header('Authorization', 'Bearer ' + token)
              try:
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      return int(getattr(resp, 'status', 200)) < 300
              except Exception:
                  return False

          def handler(event, context):
              ctx = event.get('requestContext') or {}
              route_key = ctx.get('routeKey') or ''
              connection_id = ctx.get('connectionId') or ''

              if route_key == '$connect':
                  token = _token_from_event(event)
                  if not token:
                      return _resp(401, 'missing_token')
                  conn_table.put_item(Item={
                      'connectionId': connection_id,
                      'expiresAt': _now_ttl(),
                  })
                  return _resp(200, 'ok')

              if route_key == '$disconnect':
                  _disconnect_cleanup(connection_id)
                  return _resp(200, 'ok')

              # Auth: connection must exist
              if not connection_id:
                  return _resp(400, 'missing_connection')
              existing = conn_table.get_item(Key={'connectionId': connection_id}).get('Item')
              if not existing:
                  return _resp(401, 'not_connected')

              body_raw = event.get('body') or '{}'
              try:
                  body = json.loads(body_raw) if isinstance(body_raw, str) else (body_raw or {})
              except Exception:
                  body = {}

              if route_key == 'subscribe':
                  event_id = (body.get('eventId') or '').strip()
                  if not event_id:
                      return _resp(400, 'missing_eventId')

                  token = (body.get('token') or '').strip()
                  if not token:
                      return _resp(401, 'missing_token')
                  if not _authorized_for_event(event_id, token):
                      return _resp(403, 'forbidden')

                  sub_table.put_item(Item={
                      'eventId': event_id,
                      'connectionId': connection_id,
                      'expiresAt': _now_ttl(),
                  })
                  return _resp(200, 'ok')

              if route_key == 'unsubscribe':
                  event_id = (body.get('eventId') or '').strip()
                  if not event_id:
                      return _resp(400, 'missing_eventId')
                  sub_table.delete_item(Key={'eventId': event_id, 'connectionId': connection_id})
                  return _resp(200, 'ok')

              return _resp(200, 'ok')

  PhotosWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${StackPrefix}-${Environment}-photos-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  PhotosWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PhotosWebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true

  PhotosWebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PhotosWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Join
        - ''
        - - 'arn:'
          - !Ref AWS::Partition
          - ':apigateway:'
          - !Ref AWS::Region
          - ':lambda:path/2015-03-31/functions/'
          - !GetAtt PhotosWebSocketHandlerFunction.Arn
          - /invocations

  PhotosWebSocketRouteConnect:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotosWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${PhotosWebSocketIntegration}

  PhotosWebSocketRouteDisconnect:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotosWebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${PhotosWebSocketIntegration}

  PhotosWebSocketRouteSubscribe:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotosWebSocketApi
      RouteKey: subscribe
      AuthorizationType: NONE
      Target: !Sub integrations/${PhotosWebSocketIntegration}

  PhotosWebSocketRouteUnsubscribe:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotosWebSocketApi
      RouteKey: unsubscribe
      AuthorizationType: NONE
      Target: !Sub integrations/${PhotosWebSocketIntegration}

  PhotosWebSocketRouteDefault:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotosWebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub integrations/${PhotosWebSocketIntegration}

  PhotosWebSocketLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PhotosWebSocketHandlerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotosWebSocketApi}/*

  PhotoThumbnailsFunctionZip:
    Type: AWS::Lambda::Function
    Condition: UsePhotoThumbnailsZipCond
    Properties:
      FunctionName: !Sub ${StackPrefix}-${Environment}-photo-thumbnails-zip
      Tags:
        - Key: Environment
          Value: !Ref Environment
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 1536
      Timeout: 60
      Role: !GetAtt PhotoThumbnailsFunctionRole.Arn
      Environment:
        Variables:
          BUCKET: !Sub ${StackPrefix}-${Environment}-events-photos
          BACKEND_BASE_URL: !Sub http://${LoadBalancer.DNSName}
          INTERNAL_SECRET_ARN: !Ref InternalBasicAuthSecret
          WS_ENDPOINT: !Sub https://${PhotosWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
          WS_SUBSCRIPTIONS_TABLE: !Ref PhotosWsSubscriptionsTable
      Layers:
        - !Ref PillowLayerArn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Ref PhotoThumbnailsZipS3Key

  PhotoThumbnailsFunctionImage:
    Type: AWS::Lambda::Function
    Condition: UsePhotoThumbnailsImageCond
    Properties:
      FunctionName: !Sub ${StackPrefix}-${Environment}-photo-thumbnails-image
      Tags:
        - Key: Environment
          Value: !Ref Environment
      PackageType: Image
      Timeout: 60
      MemorySize: 1536
      Role: !GetAtt PhotoThumbnailsFunctionRole.Arn
      Environment:
        Variables:
          BUCKET: !Sub ${StackPrefix}-${Environment}-events-photos
          BACKEND_BASE_URL: !Sub http://${LoadBalancer.DNSName}
          INTERNAL_SECRET_ARN: !Ref InternalBasicAuthSecret
          M_WIDTH: '1280'
          M_QUALITY: '85'
          S_WIDTH: '360'
          S_QUALITY: '70'
          WS_ENDPOINT: !Sub https://${PhotosWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
          WS_SUBSCRIPTIONS_TABLE: !Ref PhotosWsSubscriptionsTable
      Code:
        ImageUri: !Sub ${PhotoThumbnailsEcrRepository.RepositoryUri}:latest

  PhotoThumbnailsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !If
        - UsePhotoThumbnailsImageCond
        - !Ref PhotoThumbnailsFunctionImage
        - !Ref PhotoThumbnailsFunctionZip
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${StackPrefix}-${Environment}-events-photos

  GrafanaTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${StackPrefix}-${Environment}-grafana
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt GrafanaTaskRole.Arn
      ContainerDefinitions:
        - Name: grafana
          Image: grafana/grafana:11.0.0
          User: '0'
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Secrets:
            - Name: GF_SECURITY_ADMIN_USER
              ValueFrom: !Sub '${GrafanaAdminSecret}:username::'
            - Name: GF_SECURITY_ADMIN_PASSWORD
              ValueFrom: !Sub '${GrafanaAdminSecret}:password::'
          Environment:
            - Name: GF_SERVER_ROOT_URL
              Value: !Sub http://${LoadBalancer.DNSName}/grafana/
            - Name: GF_SERVER_SERVE_FROM_SUB_PATH
              Value: 'true'
          EntryPoint:
            - /bin/sh
            - -ec
          Command:
            - !Sub |
              mkdir -p /etc/grafana/provisioning/datasources
              mkdir -p /etc/grafana/provisioning/dashboards
              mkdir -p /var/lib/grafana/dashboards

              cat > /etc/grafana/provisioning/datasources/amp.yaml <<'EOF'
              apiVersion: 1
              datasources:
                - name: AMP
                  uid: amp
                  type: prometheus
                  access: proxy
                  url: https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${PrometheusWorkspace.WorkspaceId}
                  isDefault: true
                  jsonData:
                    httpMethod: POST
                    sigV4Auth: true
                    sigV4Region: ${AWS::Region}
                    sigV4Service: aps
              EOF

              cat > /etc/grafana/provisioning/datasources/cloudwatch.yaml <<'EOF'
              apiVersion: 1
              datasources:
                - name: CloudWatch
                  uid: cloudwatch
                  type: cloudwatch
                  access: proxy
                  isDefault: false
                  jsonData:
                    authType: default
                    defaultRegion: ${AWS::Region}
              EOF

              cat > /etc/grafana/provisioning/dashboards/ones.yaml <<'EOF'
              apiVersion: 1
              providers:
                - name: Ones
                  orgId: 1
                  type: file
                  disableDeletion: false
                  editable: true
                  updateIntervalSeconds: 30
                  options:
                    path: /var/lib/grafana/dashboards
              EOF

              cat > /var/lib/grafana/dashboards/ones-cost-observability.json <<'EOF'
              {
                "uid": "ones-cost-observability",
                "title": "Ones - Cost & DynamoDB Health",
                "tags": ["ones", "dynamodb", "cost"],
                "timezone": "browser",
                "schemaVersion": 39,
                "version": 1,
                "refresh": "30s",
                "panels": [
                  {
                    "type": "timeseries",
                    "title": "DynamoDB Throttles (Table) - ReadThrottleEvents",
                    "datasource": {"type": "cloudwatch", "uid": "cloudwatch"},
                    "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
                    "targets": [
                      {
                        "refId": "A",
                        "id": "queryA",
                        "queryMode": "Metrics",
                        "metricQueryType": 0,
                        "metricEditorMode": 0,
                        "region": "${AWS::Region}",
                        "namespace": "AWS/DynamoDB",
                        "metricName": "ReadThrottleEvents",
                        "dimensions": {"TableName": "${PhotosTable}"},
                        "statistic": "Sum",
                        "period": "60"
                      },
                      {
                        "refId": "B",
                        "id": "queryB",
                        "queryMode": "Metrics",
                        "metricQueryType": 0,
                        "metricEditorMode": 0,
                        "region": "${AWS::Region}",
                        "namespace": "AWS/DynamoDB",
                        "metricName": "ReadThrottleEvents",
                        "dimensions": {"TableName": "${TranslationsTable}"},
                        "statistic": "Sum",
                        "period": "60"
                      },
                      {
                        "refId": "C",
                        "id": "queryC",
                        "queryMode": "Metrics",
                        "metricQueryType": 0,
                        "metricEditorMode": 0,
                        "region": "${AWS::Region}",
                        "namespace": "AWS/DynamoDB",
                        "metricName": "ReadThrottleEvents",
                        "dimensions": {"TableName": "${InvitationsTable}"},
                        "statistic": "Sum",
                        "period": "60"
                      },
                      {
                        "refId": "D",
                        "id": "queryD",
                        "queryMode": "Metrics",
                        "metricQueryType": 0,
                        "metricEditorMode": 0,
                        "region": "${AWS::Region}",
                        "namespace": "AWS/DynamoDB",
                        "metricName": "ReadThrottleEvents",
                        "dimensions": {"TableName": "${FramesTable}"},
                        "statistic": "Sum",
                        "period": "60"
                      },
                      {
                        "refId": "E",
                        "id": "queryE",
                        "queryMode": "Metrics",
                        "metricQueryType": 0,
                        "metricEditorMode": 0,
                        "region": "${AWS::Region}",
                        "namespace": "AWS/DynamoDB",
                        "metricName": "ReadThrottleEvents",
                        "dimensions": {"TableName": "${EventTemplatesTable}"},
                        "statistic": "Sum",
                        "period": "60"
                      }
                    ]
                  },
                  {
                    "type": "timeseries",
                    "title": "DynamoDB Throttles (Table) - WriteThrottleEvents",
                    "datasource": {"type": "cloudwatch", "uid": "cloudwatch"},
                    "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
                    "targets": [
                      {
                        "refId": "A",
                        "id": "queryA",
                        "queryMode": "Metrics",
                        "metricQueryType": 0,
                        "metricEditorMode": 0,
                        "region": "${AWS::Region}",
                        "namespace": "AWS/DynamoDB",
                        "metricName": "WriteThrottleEvents",
                        "dimensions": {"TableName": "${PhotosTable}"},
                        "statistic": "Sum",
                        "period": "60"
                      },
                      {
                        "refId": "B",
                        "id": "queryB",
                        "queryMode": "Metrics",
                        "metricQueryType": 0,
                        "metricEditorMode": 0,
                        "region": "${AWS::Region}",
                        "namespace": "AWS/DynamoDB",
                        "metricName": "WriteThrottleEvents",
                        "dimensions": {"TableName": "${TranslationsTable}"},
                        "statistic": "Sum",
                        "period": "60"
                      },
                      {
                        "refId": "C",
                        "id": "queryC",
                        "queryMode": "Metrics",
                        "metricQueryType": 0,
                        "metricEditorMode": 0,
                        "region": "${AWS::Region}",
                        "namespace": "AWS/DynamoDB",
                        "metricName": "WriteThrottleEvents",
                        "dimensions": {"TableName": "${InvitationsTable}"},
                        "statistic": "Sum",
                        "period": "60"
                      },
                      {
                        "refId": "D",
                        "id": "queryD",
                        "queryMode": "Metrics",
                        "metricQueryType": 0,
                        "metricEditorMode": 0,
                        "region": "${AWS::Region}",
                        "namespace": "AWS/DynamoDB",
                        "metricName": "WriteThrottleEvents",
                        "dimensions": {"TableName": "${FramesTable}"},
                        "statistic": "Sum",
                        "period": "60"
                      },
                      {
                        "refId": "E",
                        "id": "queryE",
                        "queryMode": "Metrics",
                        "metricQueryType": 0,
                        "metricEditorMode": 0,
                        "region": "${AWS::Region}",
                        "namespace": "AWS/DynamoDB",
                        "metricName": "WriteThrottleEvents",
                        "dimensions": {"TableName": "${EventTemplatesTable}"},
                        "statistic": "Sum",
                        "period": "60"
                      }
                    ]
                  },
                  {
                    "type": "timeseries",
                    "title": "DynamoDB Scan Fallback (should be 0)",
                    "datasource": {"type": "prometheus", "uid": "amp"},
                    "gridPos": {"h": 7, "w": 24, "x": 0, "y": 16},
                    "targets": [
                      {
                        "refId": "A",
                        "expr": "increase(ones_dynamodb_scan_fallback_total[5m])",
                        "legendFormat": "{{repository}}/{{operation}}"
                      }
                    ]
                  },
                  {
                    "type": "timeseries",
                    "title": "Cache Hit Ratio (by cache)",
                    "datasource": {"type": "prometheus", "uid": "amp"},
                    "gridPos": {"h": 8, "w": 24, "x": 0, "y": 23},
                    "fieldConfig": {"defaults": {"min": 0, "max": 1}},
                    "targets": [
                      {
                        "refId": "A",
                        "expr": "sum by (cache) (rate(cache_gets_total{result=\"hit\",cache=~\"translationsByLanguage|photosByEventFirstPage|invitationsByEvent|framesById|eventTemplatesByStatus\"}[5m])) / sum by (cache) (rate(cache_gets_total{cache=~\"translationsByLanguage|photosByEventFirstPage|invitationsByEvent|framesById|eventTemplatesByStatus\"}[5m]))",
                        "legendFormat": "{{cache}}"
                      }
                    ]
                  }
                ]
              }
              EOF

              exec /run.sh
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
    Properties:
      ServiceName: !Sub ${StackPrefix}-${Environment}-ones-api
      Cluster: !Ref Cluster
      DesiredCount: !Ref BackendDesiredCount
      HealthCheckGracePeriodSeconds: 240
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: ones-api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: Environment
          Value: !Ref Environment

  GrafanaService:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
      - GrafanaListenerRule
    Properties:
      ServiceName: !Sub ${StackPrefix}-${Environment}-grafana
      Cluster: !Ref Cluster
      DesiredCount: !Ref GrafanaDesiredCount
      HealthCheckGracePeriodSeconds: 120
      LaunchType: FARGATE
      TaskDefinition: !Ref GrafanaTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: grafana
          ContainerPort: 3000
          TargetGroupArn: !Ref GrafanaTargetGroup
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  AlbUrl:
    Value: !Sub http://${LoadBalancer.DNSName}
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  PhotosWsUrl:
    Value: !Sub wss://${PhotosWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  GrafanaUrl:
    Value: !Sub http://${LoadBalancer.DNSName}/grafana/
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  PhotoThumbnailsEcrRepositoryUri:
    Value: !GetAtt PhotoThumbnailsEcrRepository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  EventsTableName:
    Value: !Ref EventsTable
  UsersTableName:
    Value: !Ref UsersTable
  InvitationsTableName:
    Value: !Ref InvitationsTable
  CoverPreviewsTableName:
    Value: !Ref CoverPreviewsTable
  CoverReservationsTableName:
    Value: !Ref CoverReservationsTable
  PhotosTableName:
    Value: !Ref PhotosTable
  PhotoLikesTableName:
    Value: !Ref PhotoLikesTable
  PreferredNamesCacheTableName:
    Value: !Ref PreferredNamesCacheTable
  AdminsTableName:
    Value: !Ref AdminsTable
  FramesTableName:
    Value: !Ref FramesTable
  EventTemplatesTableName:
    Value: !Ref EventTemplatesTable
  TranslationsTableName:
    Value: !Ref TranslationsTable
  EventsCoversTempBucketName:
    Value: !Ref EventsCoversTempBucket
  EventsAssetsBucketName:
    Value: !Ref EventsAssetsBucket
  EventsPhotosBucketName:
    Value: !Ref EventsPhotosBucket
  OpenAiApiKeySecretName:
    Value: !Ref OpenAiApiKeySecret
  OpenAiApiKeySecretArn:
    Value: !GetAtt OpenAiApiKeySecret.Id

  ActuatorBasicAuthSecretName:
