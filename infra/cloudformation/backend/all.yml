            - Name: ONES_EMAIL_LOGO_URL
              Value: !Ref EmailLogoUrl
            - Name: ONES_PUBLIC_BASE_URL
              Value: !Ref PublicBaseUrl
            - Name: ONES_EMAIL_ACTION_TOKEN_SECRET_NAME
              Value: !Ref InvitationEmailActionTokenSecret
            - Name: ONES_EVENT_INVITE_LINK_SECRET_NAME
              Value: !Ref InvitationEmailActionTokenSecret
            - Name: ONES_EVENTS_TABLE
              Value: !Ref EventsTable
            - Name: ONES_USERS_TABLE
              Value: !Ref UsersTable
            - Name: ONES_INVITATIONS_TABLE
              Value: !Ref InvitationsTable
            - Name: ONES_COVER_PREVIEWS_TABLE
              Value: !Ref CoverPreviewsTable
            - Name: ONES_COVER_RESERVATIONS_TABLE
              Value: !Ref CoverReservationsTable
            - Name: ONES_PHOTOS_TABLE
              Value: !Ref PhotosTable
            - Name: ONES_DYNAMODB_PHOTO_LIKES_TABLE_NAME
              Value: !Ref PhotoLikesTable
            - Name: ONES_DYNAMODB_PHOTO_SHORTLINKS_TABLE_NAME
              Value: !Ref PhotoShortLinksTable
            - Name: ONES_PREFERRED_NAMES_CACHE_TABLE
              Value: !Ref PreferredNamesCacheTable
            - Name: ONES_ADMINS_TABLE
              Value: !Ref AdminsTable
            - Name: ONES_FRAMES_TABLE
              Value: !Ref FramesTable
            - Name: ONES_EVENT_TEMPLATES_TABLE
              Value: !Ref EventTemplatesTable
            - Name: ONES_TRANSLATIONS_TABLE
              Value: !Ref TranslationsTable
            - Name: ONES_EVENTS_COVERS_TEMP_BUCKET
              Value: !Ref EventsCoversTempBucket
            - Name: ONES_EVENTS_ASSETS_BUCKET
              Value: !Ref EventsAssetsBucket
            - Name: ONES_EVENTS_PHOTOS_BUCKET
              Value: !Sub ${StackPrefix}-${Environment}-events-photos
            - Name: OPENAI_API_KEY_SECRET_NAME
              Value: !Ref OpenAiApiKeySecret
