                  - !GetAtt CoverReservationsTable.Arn
                  - !GetAtt PhotosTable.Arn
                  - !Sub ${PhotosTable.Arn}/index/*
                  - !GetAtt PhotoLikesTable.Arn
                  - !Sub ${PhotoLikesTable.Arn}/index/*
                  - !GetAtt PhotoShortLinksTable.Arn
                  - !GetAtt PreferredNamesCacheTable.Arn
                  - !GetAtt AdminsTable.Arn
