AWSTemplateFormatVersion: '2010-09-09'
Description: Ones MVP - Backend stack (ECR + ECS Fargate + ALB + DynamoDB)

Parameters:
  StackPrefix:
    Type: String
    Default: ones
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stage
      - prod
  GoogleClientId:
    Type: String
    Default: ''
  AppBaseUrl:
    Type: String
    Default: ''
  BackendDesiredCount:
    Type: Number
    Default: 0

  UsePhotoThumbnailsImage:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  GrafanaDesiredCount:
    Type: Number
    Default: 1

  # CDN Configuration
  CdnPhotosEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CdnPhotosSigningPublicKeyPem:
    Type: String
    Default: ''

  CdnPhotosSigningPublicKeySsmParamName:
    Type: String
    Default: ''

  CdnPhotosSigningPublicKeyVersion:
    Type: String
    Default: v1

  CdnPhotosUrlTtlMinutes:
    Type: Number
    Default: 120

  CdnPhotosUrlRoundingSeconds:
    Type: Number
    Default: 300

  CdnPhotosSocialShareTtlDays:
    Type: Number
    Default: 7

  LambdaArtifactsBucket:
    Type: String
    Default: ''

  CleanupFunctionS3Key:
    Type: String
    Default: ''

  PhotoThumbnailsZipS3Key:
    Type: String
    Default: ''

Conditions:
  UsePhotoThumbnailsImageCond: !Equals [!Ref UsePhotoThumbnailsImage, 'true']
  UsePhotoThumbnailsZipCond: !Not [!Equals [!Ref UsePhotoThumbnailsImage, 'true']]
  EnablePhotosCdnCond: !And
    - !Equals [!Ref CdnPhotosEnabled, 'true']
    - !Not [!Equals [!Ref CdnPhotosSigningPublicKeySsmParamName, '']]

Resources:
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-events
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-users
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byEmail
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  InvitationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-invitations
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: inviteeEmail
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: inviteeEmail
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byEventId
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: inviteeEmail
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CoverPreviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-cover-previews
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: coverId
          AttributeType: S
      KeySchema:
        - AttributeName: coverId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  CoverReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-cover-reservations
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: reservationId
          AttributeType: S
      KeySchema:
        - AttributeName: reservationId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  PhotosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-photos
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: photoId
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: eventSortKey
          AttributeType: S
      KeySchema:
        - AttributeName: photoId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byEventId
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: eventSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PhotoLikesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-photo-likes
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: photoId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: photoId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PhotoShortLinksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-photo-shortlinks
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  PreferredNamesCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-preferred-names-cache
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AdminsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-admins
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  FramesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-frames
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: frameId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: frameId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EventTemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-event-templates
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: eventTemplateId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: eventTemplateId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EventsCoversTempBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${StackPrefix}-${Environment}-events-covers-tmp
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-events-covers-tmp
        - Key: Environment
          Value: !Ref Environment
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: delete-old-previews
            Status: Enabled
            ExpirationInDays: 1

  EventsAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${StackPrefix}-${Environment}-events-assets
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-events-assets
        - Key: Environment
          Value: !Ref Environment
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  EventsPhotosBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - PhotoThumbnailsPermission
    Properties:
      BucketName: !Sub ${StackPrefix}-${Environment}-events-photos
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-events-photos
        - Key: Environment
          Value: !Ref Environment
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:Put
            Function: !If
              - UsePhotoThumbnailsImageCond
              - !GetAtt PhotoThumbnailsFunctionImage.Arn
              - !GetAtt PhotoThumbnailsFunctionZip.Arn

  PhotosOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: EnablePhotosCdnCond
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${StackPrefix}-${Environment}-photos-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PhotosCdnPublicKey:
    Type: AWS::CloudFront::PublicKey
    Condition: EnablePhotosCdnCond
    Properties:
      PublicKeyConfig:
        CallerReference: !Sub ${StackPrefix}-${Environment}-${AWS::Region}-photos-public-key-${CdnPhotosSigningPublicKeyVersion}
        Name: !Sub ${StackPrefix}-${Environment}-photos-public-key-${CdnPhotosSigningPublicKeyVersion}
        EncodedKey: !Sub "{{resolve:ssm:${CdnPhotosSigningPublicKeySsmParamName}}}"
        Comment: !Sub ${StackPrefix}-${Environment} photos CDN signed URLs public key

  PhotosCdnKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Condition: EnablePhotosCdnCond
    Properties:
      KeyGroupConfig:
        Name: !Sub ${StackPrefix}-${Environment}-photos-key-group-${CdnPhotosSigningPublicKeyVersion}
        Comment: !Sub ${StackPrefix}-${Environment} photos CDN key group
        Items:
          - !Ref PhotosCdnPublicKey

  PhotosCdnResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: EnablePhotosCdnCond
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${StackPrefix}-${Environment}-photos-cors
        Comment: !Sub ${StackPrefix}-${Environment} photos CDN CORS policy
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - '*'
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowOrigins:
            Items:
              - https://appdev.ones.events
          OriginOverride: true

  PhotosDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: EnablePhotosCdnCond
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Origins:
          - Id: photosorigin
            DomainName: !GetAtt EventsPhotosBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref PhotosOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: photosorigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          TrustedKeyGroups:
            - !Ref PhotosCdnKeyGroup
          ResponseHeadersPolicyId: !Ref PhotosCdnResponseHeadersPolicy
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000

  EventsPhotosBucketPolicyForCdn:
    Type: AWS::S3::BucketPolicy
    Condition: EnablePhotosCdnCond
    Properties:
      Bucket: !Ref EventsPhotosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub ${EventsPhotosBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${PhotosDistribution}

  OpenAiApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackPrefix}-${Environment}-openai-api-key
      Description: OpenAI API key for AI Event Cover generation
      SecretString: '{}'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  ActuatorBasicAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackPrefix}-${Environment}-actuator-basic-auth
      Description: Basic Auth credentials for /actuator endpoints (username/password)
      SecretString: '{"username":"","password":""}'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  InternalBasicAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackPrefix}-${Environment}-internal-basic-auth
      Description: Basic Auth credentials for /internal endpoints (username/password)
      SecretString: '{"username":"","password":""}'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  GrafanaAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackPrefix}-${Environment}-grafana-admin
      Description: Admin credentials for Grafana (username/password)
      SecretString: '{"username":"admin","password":"CHANGE_ME"}'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  CloudFrontPrivateKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${StackPrefix}-${Environment}-cloudfront-private-key
      Description: CloudFront private key for signed URLs (PKCS#8 PEM)
      SecretString: 'CHANGE_ME: Paste your CloudFront private key here (PKCS#8 PEM format)'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  PrometheusWorkspace:
    Type: AWS::APS::Workspace
    # Properties omitted to avoid null/empty map validation errors
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref Environment

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${StackPrefix}-${Environment}-ones-api
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  PhotoThumbnailsEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${StackPrefix}-${Environment}-photo-thumbnails
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLambdaServicePull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  CleanupFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackPrefix}-${Environment}-cleanup-role
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ones-backend-cleanup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub arn:aws:s3:::${EventsCoversTempBucket}
                  - !Sub arn:aws:s3:::${EventsAssetsBucket}
                  - !Sub arn:aws:s3:::${EventsPhotosBucket}
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub arn:aws:s3:::${EventsCoversTempBucket}/*
                  - !Sub arn:aws:s3:::${EventsAssetsBucket}/*
                  - !Sub arn:aws:s3:::${EventsPhotosBucket}/*
              - Effect: Allow
                Action:
                  - ecr:ListImages
                  - ecr:BatchDeleteImage
                Resource: !GetAtt EcrRepository.Arn

  CleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${StackPrefix}-${Environment}-cleanup
      Tags:
        - Key: Environment
          Value: !Ref Environment
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt CleanupFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Ref CleanupFunctionS3Key

  CleanupOnDelete:
    Type: Custom::CleanupOnDelete
    Properties:
      ServiceToken: !GetAtt CleanupFunction.Arn
      Buckets:
        - !Ref EventsCoversTempBucket
        - !Ref EventsAssetsBucket
        - !Ref EventsPhotosBucket
      EcrRepositoryName: !Ref EcrRepository

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Sub ${AWS::Region}a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Sub ${AWS::Region}b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-public-b

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${StackPrefix}-${Environment}-alb-sg
      GroupDescription: ALB ingress
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-alb-sg
        - Key: Environment
          Value: !Ref Environment

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${StackPrefix}-${Environment}-svc-sg
      GroupDescription: Service SG
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-svc-sg
        - Key: Environment
          Value: !Ref Environment

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      LoadBalancerName: !Sub ${StackPrefix}-${Environment}-alb
      Scheme: internet-facing
      Type: application
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '120'
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-alb
        - Key: Environment
          Value: !Ref Environment

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetGroupName: !Sub ${StackPrefix}-${Environment}-api-tg
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref Vpc
      TargetType: ip
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: 200
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-tg
        - Key: Environment
          Value: !Ref Environment

  GrafanaTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetGroupName: !Sub ${StackPrefix}-${Environment}-graf-tg
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref Vpc
      TargetType: ip
      HealthCheckPath: /api/health
      Matcher:
        HttpCode: 200
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-grafana-tg
        - Key: Environment
          Value: !Ref Environment

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  GrafanaListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /grafana
              - /grafana/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GrafanaTargetGroup

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${StackPrefix}-${Environment}-cluster
      Tags:
        - Key: Environment
          Value: !Ref Environment

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackPrefix}-${Environment}-task-exec-role
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ones-secrets-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref OpenAiApiKeySecret
                  - !Ref ActuatorBasicAuthSecret
                  - !Ref InternalBasicAuthSecret
                  - !Ref GrafanaAdminSecret
                  - !Ref CloudFrontPrivateKeySecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackPrefix}-${Environment}-task-role
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ones-dynamodb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt EventsTable.Arn
                  - !Sub ${EventsTable.Arn}/index/*
                  - !GetAtt UsersTable.Arn
                  - !Sub ${UsersTable.Arn}/index/*
                  - !GetAtt InvitationsTable.Arn
                  - !Sub ${InvitationsTable.Arn}/index/*
                  - !GetAtt CoverPreviewsTable.Arn
                  - !GetAtt CoverReservationsTable.Arn
                  - !GetAtt PhotosTable.Arn
                  - !Sub ${PhotosTable.Arn}/index/*
                  - !GetAtt PhotoLikesTable.Arn
                  - !Sub ${PhotoLikesTable.Arn}/index/*
                  - !GetAtt PhotoShortLinksTable.Arn
                  - !GetAtt PreferredNamesCacheTable.Arn
                  - !GetAtt AdminsTable.Arn
                  - !GetAtt FramesTable.Arn
                  - !Sub ${FramesTable.Arn}/index/*
                  - !GetAtt EventTemplatesTable.Arn
        - PolicyName: ones-s3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub ${EventsCoversTempBucket.Arn}/*
                  - !Sub ${EventsAssetsBucket.Arn}/*
                  - !Sub arn:aws:s3:::${StackPrefix}-${Environment}-events-photos/*
        - PolicyName: ones-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref OpenAiApiKeySecret
                  - !Ref ActuatorBasicAuthSecret
                  - !Ref CloudFrontPrivateKeySecret

        - PolicyName: ones-amp-remote-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aps:RemoteWrite
                  - aps:GetSeries
                  - aps:GetLabels
                  - aps:GetMetricMetadata
                Resource: !GetAtt PrometheusWorkspace.Arn

  GrafanaTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackPrefix}-${Environment}-grafana-task-role
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: grafana-amp-query
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aps:QueryMetrics
                  - aps:GetSeries
                  - aps:GetLabels
                  - aps:GetMetricMetadata
                Resource: !GetAtt PrometheusWorkspace.Arn

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${StackPrefix}/${Environment}/ones-api
      RetentionInDays: 7
      Tags:
        - Key: Environment
          Value: !Ref Environment

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${StackPrefix}-${Environment}-ones-api
      Cpu: '256'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: ones-api
          Image: !Sub ${EcrRepository.RepositoryUri}:latest
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Secrets:
            - Name: ONES_ACTUATOR_BASIC_USERNAME
              ValueFrom: !Sub '${ActuatorBasicAuthSecret}:username::'
            - Name: ONES_ACTUATOR_BASIC_PASSWORD
              ValueFrom: !Sub '${ActuatorBasicAuthSecret}:password::'
            - Name: ONES_INTERNAL_BASIC_USERNAME
              ValueFrom: !Sub '${InternalBasicAuthSecret}:username::'
            - Name: ONES_INTERNAL_BASIC_PASSWORD
              ValueFrom: !Sub '${InternalBasicAuthSecret}:password::'
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: ONES_ENV
              Value: !Ref Environment
            - Name: ONES_APP_BASE_URL
              Value: !Ref AppBaseUrl
            - Name: ONES_PHOTOS_DEBUG_LIST
              Value: 'false'
            - Name: ONES_EVENTS_TABLE
              Value: !Ref EventsTable
            - Name: ONES_USERS_TABLE
              Value: !Ref UsersTable
            - Name: ONES_INVITATIONS_TABLE
              Value: !Ref InvitationsTable
            - Name: ONES_COVER_PREVIEWS_TABLE
              Value: !Ref CoverPreviewsTable
            - Name: ONES_COVER_RESERVATIONS_TABLE
              Value: !Ref CoverReservationsTable
            - Name: ONES_PHOTOS_TABLE
              Value: !Ref PhotosTable
            - Name: ONES_DYNAMODB_PHOTO_LIKES_TABLE_NAME
              Value: !Ref PhotoLikesTable
            - Name: ONES_DYNAMODB_PHOTO_SHORTLINKS_TABLE_NAME
              Value: !Ref PhotoShortLinksTable
            - Name: ONES_PREFERRED_NAMES_CACHE_TABLE
              Value: !Ref PreferredNamesCacheTable
            - Name: ONES_ADMINS_TABLE
              Value: !Ref AdminsTable
            - Name: ONES_FRAMES_TABLE
              Value: !Ref FramesTable
            - Name: ONES_EVENT_TEMPLATES_TABLE
              Value: !Ref EventTemplatesTable
            - Name: ONES_EVENTS_COVERS_TEMP_BUCKET
              Value: !Ref EventsCoversTempBucket
            - Name: ONES_EVENTS_ASSETS_BUCKET
              Value: !Ref EventsAssetsBucket
            - Name: ONES_EVENTS_PHOTOS_BUCKET
              Value: !Sub ${StackPrefix}-${Environment}-events-photos
            - Name: OPENAI_API_KEY_SECRET_NAME
              Value: !Ref OpenAiApiKeySecret
            - Name: GOOGLE_CLIENT_ID
              Value: !Ref GoogleClientId
            - Name: CORS_ALLOWED_ORIGINS
              Value: '*'
            # CDN Configuration
            - Name: ONES_CDN_PHOTOS_ENABLED
              Value: !If [EnablePhotosCdnCond, 'true', 'false']
            - Name: ONES_CDN_PHOTOS_BASE_URL
              Value: !If [EnablePhotosCdnCond, !Sub 'https://${PhotosDistribution.DomainName}', '']
            - Name: ONES_CDN_PHOTOS_SIGNING_KEY_PAIR_ID
              Value: !If [EnablePhotosCdnCond, !Ref PhotosCdnPublicKey, '']
            - Name: ONES_CDN_PHOTOS_SIGNING_PRIVATE_KEY_SECRET_NAME
              Value: !Ref CloudFrontPrivateKeySecret
            - Name: ONES_CDN_PHOTOS_URL_TTL_MINUTES
              Value: !Ref CdnPhotosUrlTtlMinutes
            - Name: ONES_CDN_PHOTOS_URL_ROUNDING_SECONDS
              Value: !Ref CdnPhotosUrlRoundingSeconds
            - Name: ONES_CDN_PHOTOS_SOCIAL_SHARE_TTL_DAYS
              Value: !Ref CdnPhotosSocialShareTtlDays
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

        - Name: adot-collector
          Image: public.ecr.aws/aws-observability/aws-otel-collector:latest
          Secrets:
            - Name: ONES_ACTUATOR_BASIC_USERNAME
              ValueFrom: !Sub '${ActuatorBasicAuthSecret}:username::'
            - Name: ONES_ACTUATOR_BASIC_PASSWORD
              ValueFrom: !Sub '${ActuatorBasicAuthSecret}:password::'
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AOT_CONFIG_CONTENT
              Value: !Sub |
                receivers:
                  prometheus:
                    config:
                      scrape_configs:
                        - job_name: ones-api
                          metrics_path: /actuator/prometheus
                          scheme: http
                          basic_auth:
                            username: ${!ONES_ACTUATOR_BASIC_USERNAME}
                            password: ${!ONES_ACTUATOR_BASIC_PASSWORD}
                          static_configs:
                            - targets: ["127.0.0.1:8080"]
                exporters:
                  prometheusremotewrite:
                    endpoint: https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${PrometheusWorkspace.WorkspaceId}/api/v1/remote_write
                    auth:
                      authenticator: sigv4auth
                extensions:
                  sigv4auth:
                    region: ${AWS::Region}
                    service: aps
                service:
                  extensions: [sigv4auth]
                  pipelines:
                    metrics:
                      receivers: [prometheus]
                      exporters: [prometheusremotewrite]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  PhotoThumbnailsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackPrefix}-${Environment}-photo-thumbnails-role
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ones-photos-thumbnails
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::${StackPrefix}-${Environment}-events-photos/*
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref InternalBasicAuthSecret

  PhotoThumbnailsFunctionZip:
    Type: AWS::Lambda::Function
    Condition: UsePhotoThumbnailsZipCond
    Properties:
      FunctionName: !Sub ${StackPrefix}-${Environment}-photo-thumbnails-zip
      Tags:
        - Key: Environment
          Value: !Ref Environment
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 1536
      Timeout: 60
      Role: !GetAtt PhotoThumbnailsFunctionRole.Arn
      Environment:
        Variables:
          BUCKET: !Sub ${StackPrefix}-${Environment}-events-photos
          BACKEND_BASE_URL: !Sub http://${LoadBalancer.DNSName}
          INTERNAL_SECRET_ARN: !Ref InternalBasicAuthSecret
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Ref PhotoThumbnailsZipS3Key

  PhotoThumbnailsFunctionImage:
    Type: AWS::Lambda::Function
    Condition: UsePhotoThumbnailsImageCond
    Properties:
      FunctionName: !Sub ${StackPrefix}-${Environment}-photo-thumbnails-image
      Tags:
        - Key: Environment
          Value: !Ref Environment
      PackageType: Image
      Timeout: 60
      MemorySize: 1536
      Role: !GetAtt PhotoThumbnailsFunctionRole.Arn
      Environment:
        Variables:
          BUCKET: !Sub ${StackPrefix}-${Environment}-events-photos
          BACKEND_BASE_URL: !Sub http://${LoadBalancer.DNSName}
          INTERNAL_SECRET_ARN: !Ref InternalBasicAuthSecret
          M_WIDTH: '1280'
          M_QUALITY: '85'
          S_WIDTH: '360'
          S_QUALITY: '70'
      Code:
        ImageUri: !Sub ${PhotoThumbnailsEcrRepository.RepositoryUri}:latest

  PhotoThumbnailsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !If
        - UsePhotoThumbnailsImageCond
        - !Ref PhotoThumbnailsFunctionImage
        - !Ref PhotoThumbnailsFunctionZip
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${StackPrefix}-${Environment}-events-photos

  GrafanaTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${StackPrefix}-${Environment}-grafana
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt GrafanaTaskRole.Arn
      ContainerDefinitions:
        - Name: grafana
          Image: grafana/grafana:11.0.0
          User: '0'
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Secrets:
            - Name: GF_SECURITY_ADMIN_USER
              ValueFrom: !Sub '${GrafanaAdminSecret}:username::'
            - Name: GF_SECURITY_ADMIN_PASSWORD
              ValueFrom: !Sub '${GrafanaAdminSecret}:password::'
          Environment:
            - Name: GF_SERVER_ROOT_URL
              Value: !Sub http://${LoadBalancer.DNSName}/grafana/
            - Name: GF_SERVER_SERVE_FROM_SUB_PATH
              Value: 'true'
          EntryPoint:
            - /bin/sh
            - -ec
          Command:
            - !Sub |
              mkdir -p /etc/grafana/provisioning/datasources
              cat > /etc/grafana/provisioning/datasources/amp.yaml <<'EOF'
              apiVersion: 1
              datasources:
                - name: AMP
                  type: prometheus
                  access: proxy
                  url: https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${PrometheusWorkspace.WorkspaceId}
                  isDefault: true
                  jsonData:
                    httpMethod: POST
                    sigV4Auth: true
                    sigV4Region: ${AWS::Region}
                    sigV4Service: aps
              EOF
              exec /run.sh
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
    Properties:
      ServiceName: !Sub ${StackPrefix}-${Environment}-ones-api
      Cluster: !Ref Cluster
      DesiredCount: !Ref BackendDesiredCount
      HealthCheckGracePeriodSeconds: 240
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: ones-api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: Environment
          Value: !Ref Environment

  GrafanaService:
    Type: AWS::ECS::Service
    DependsOn:
      - Listener
      - GrafanaListenerRule
    Properties:
      ServiceName: !Sub ${StackPrefix}-${Environment}-grafana
      Cluster: !Ref Cluster
      DesiredCount: !Ref GrafanaDesiredCount
      HealthCheckGracePeriodSeconds: 120
      LaunchType: FARGATE
      TaskDefinition: !Ref GrafanaTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: grafana
          ContainerPort: 3000
          TargetGroupArn: !Ref GrafanaTargetGroup
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  AlbUrl:
    Value: !Sub http://${LoadBalancer.DNSName}
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  GrafanaUrl:
    Value: !Sub http://${LoadBalancer.DNSName}/grafana/
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  PhotoThumbnailsEcrRepositoryUri:
    Value: !GetAtt PhotoThumbnailsEcrRepository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  EventsTableName:
    Value: !Ref EventsTable
  UsersTableName:
    Value: !Ref UsersTable
  InvitationsTableName:
    Value: !Ref InvitationsTable
  CoverPreviewsTableName:
    Value: !Ref CoverPreviewsTable
  CoverReservationsTableName:
    Value: !Ref CoverReservationsTable
  PhotosTableName:
    Value: !Ref PhotosTable
  PhotoLikesTableName:
    Value: !Ref PhotoLikesTable
  PreferredNamesCacheTableName:
    Value: !Ref PreferredNamesCacheTable
  AdminsTableName:
    Value: !Ref AdminsTable
  FramesTableName:
    Value: !Ref FramesTable
  EventTemplatesTableName:
    Value: !Ref EventTemplatesTable
  EventsCoversTempBucketName:
    Value: !Ref EventsCoversTempBucket
  EventsAssetsBucketName:
    Value: !Ref EventsAssetsBucket
  EventsPhotosBucketName:
    Value: !Ref EventsPhotosBucket
  OpenAiApiKeySecretName:
    Value: !Ref OpenAiApiKeySecret
  OpenAiApiKeySecretArn:
    Value: !GetAtt OpenAiApiKeySecret.Id

  ActuatorBasicAuthSecretName:
    Value: !Ref ActuatorBasicAuthSecret

  InternalBasicAuthSecretName:
    Value: !Ref InternalBasicAuthSecret

  PrometheusWorkspaceId:
    Value: !GetAtt PrometheusWorkspace.WorkspaceId
  PrometheusWorkspaceArn:
    Value: !GetAtt PrometheusWorkspace.Arn