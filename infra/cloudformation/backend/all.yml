  PhotosTableConsumedReadCapacityAnomalyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StackPrefix}-${Environment}-ddb-photos-consumed-rcu-anomaly
      ComparisonOperator: GreaterThanUpperThreshold
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      ThresholdMetricId: ad1
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Metrics:
        - Id: m1
          Label: PhotosTable ConsumedReadCapacityUnits
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ConsumedReadCapacityUnits
              Dimensions:
                - Name: TableName
                  Value: !Ref PhotosTable
            Period: 300
            Stat: Sum
          ReturnData: true
        - Id: ad1
          Label: PhotosTable ConsumedReadCapacityUnits (expected)
          Expression: ANOMALY_DETECTION_BAND(m1, 2)
          ReturnData: true

  InvitationsTableConsumedReadCapacityAnomalyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StackPrefix}-${Environment}-ddb-invitations-consumed-rcu-anomaly
      ComparisonOperator: GreaterThanUpperThreshold
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      ThresholdMetricId: ad1
