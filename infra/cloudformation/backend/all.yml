AWSTemplateFormatVersion: '2010-09-09'
Description: Ones MVP - Backend stack (ECR + ECS Fargate + ALB + DynamoDB)

Parameters:
  StackPrefix:
    Type: String
    Default: ones
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stage
      - prod
  GoogleClientId:
    Type: String
    Default: ''
  AppBaseUrl:
    Type: String
    Default: ''

  # Email invitations (SES)
  EmailEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  EmailFrom:
    Type: String
    Default: donotreply@ones.events

  EmailLogoUrl:
    Type: String
    Default: ''

  PublicBaseUrl:
    Type: String
    Default: ''
  BackendDesiredCount:
    Type: Number
    Default: 0

  UsePhotoThumbnailsImage:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  GrafanaDesiredCount:
    Type: Number
    Default: 1

  # CDN Configuration
  CdnPhotosEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  CdnPhotosSigningPublicKeyPem:
    Type: String
    Default: ''

  CdnPhotosSigningPublicKeySsmParamName:
    Type: String
    Default: ''

  CdnPhotosSigningPublicKeyVersion:
    Type: String
    Default: v1

  CdnPhotosUrlTtlMinutes:
    Type: Number
    Default: 120

  CdnPhotosUrlRoundingSeconds:
    Type: Number
    Default: 300

  CdnPhotosSocialShareTtlDays:
    Type: Number
    Default: 7

  LambdaArtifactsBucket:
    Type: String
    Default: ''

  CleanupFunctionS3Key:
    Type: String
    Default: ''

  PhotoThumbnailsZipS3Key:
    Type: String
    Default: ''

  PillowLayerArn:
    Type: String
    Default: 'arn:aws:lambda:us-east-1:770693421928:layer:Klayers-p312-Pillow:9'

Conditions:
  UsePhotoThumbnailsImageCond: !Equals [!Ref UsePhotoThumbnailsImage, 'true']
  UsePhotoThumbnailsZipCond: !Not [!Equals [!Ref UsePhotoThumbnailsImage, 'true']]
  EnablePhotosCdnCond: !And
    - !Equals [!Ref CdnPhotosEnabled, 'true']
    - !Not [!Equals [!Ref CdnPhotosSigningPublicKeySsmParamName, '']]
  IsNotProdEnv: !Not [!Equals [!Ref Environment, 'prod']]

Resources:
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-events
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-users
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byEmail
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  InvitationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-invitations
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 3
        WriteCapacityUnits: 1
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: inviteeEmail
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: inviteeEmail
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byEventId
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: inviteeEmail
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1

  CoverPreviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-cover-previews
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: coverId
          AttributeType: S
      KeySchema:
        - AttributeName: coverId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  CoverReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-cover-reservations
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: reservationId
          AttributeType: S
      KeySchema:
        - AttributeName: reservationId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  PhotosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-photos
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 2
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: photoId
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: eventSortKey
          AttributeType: S
      KeySchema:
        - AttributeName: photoId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byEventId
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: eventSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 2

  PhotoLikesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-photo-likes
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: photoId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: photoId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PhotoShortLinksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-photo-shortlinks
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  PreferredNamesCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-preferred-names-cache
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AdminsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-admins
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  FramesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-frames
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: frameId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: frameId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EventTemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-event-templates
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: eventTemplateId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: eventTemplateId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TranslationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-translations
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 1
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Resource
          Value: Translations
      AttributeDefinitions:
        - AttributeName: translationKey
          AttributeType: S
        - AttributeName: languageCode
          AttributeType: S
      KeySchema:
        - AttributeName: translationKey
          KeyType: HASH
        - AttributeName: languageCode
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: LanguageCodeIndex
          KeySchema:
            - AttributeName: languageCode
              KeyType: HASH
            - AttributeName: translationKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 1

  PhotosWsConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-photos-ws-connections
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  PhotosWsSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${StackPrefix}-${Environment}-photos-ws-subscriptions
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
        - AttributeName: connectionId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byConnectionId
          KeySchema:
            - AttributeName: connectionId
              KeyType: HASH
            - AttributeName: eventId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  DynamoDbAutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - application-autoscaling.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: dynamodb-application-autoscaling
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:DescribeLimits
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:SetAlarmState
                  - cloudwatch:DeleteAlarms
                Resource: '*'

  PhotosTableReadScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 500
      MinCapacity: 5
      ResourceId: !Sub table/${PhotosTable}
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:table:ReadCapacityUnits
      ServiceNamespace: dynamodb

  PhotosTableReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: photos-table-read
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref PhotosTableReadScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  PhotosTableWriteScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 200
      MinCapacity: 2
      ResourceId: !Sub table/${PhotosTable}
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:table:WriteCapacityUnits
      ServiceNamespace: dynamodb

  PhotosTableWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: photos-table-write
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref PhotosTableWriteScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  PhotosByEventIdIndexReadScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 500
      MinCapacity: 5
      ResourceId: !Sub table/${PhotosTable}/index/byEventId
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:index:ReadCapacityUnits
      ServiceNamespace: dynamodb

  PhotosByEventIdIndexReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: photos-byEventId-read
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref PhotosByEventIdIndexReadScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  PhotosByEventIdIndexWriteScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 200
      MinCapacity: 2
      ResourceId: !Sub table/${PhotosTable}/index/byEventId
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:index:WriteCapacityUnits
      ServiceNamespace: dynamodb

  PhotosByEventIdIndexWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: photos-byEventId-write
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref PhotosByEventIdIndexWriteScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  InvitationsTableReadScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 200
      MinCapacity: 3
      ResourceId: !Sub table/${InvitationsTable}
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:table:ReadCapacityUnits
      ServiceNamespace: dynamodb

  InvitationsTableReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: invitations-table-read
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref InvitationsTableReadScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  InvitationsTableWriteScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 100
      MinCapacity: 1
      ResourceId: !Sub table/${InvitationsTable}
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:table:WriteCapacityUnits
      ServiceNamespace: dynamodb

  InvitationsTableWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: invitations-table-write
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref InvitationsTableWriteScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  InvitationsByEventIdIndexReadScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 200
      MinCapacity: 1
      ResourceId: !Sub table/${InvitationsTable}/index/byEventId
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:index:ReadCapacityUnits
      ServiceNamespace: dynamodb

  InvitationsByEventIdIndexReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: invitations-byEventId-read
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref InvitationsByEventIdIndexReadScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  InvitationsByEventIdIndexWriteScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 100
      MinCapacity: 1
      ResourceId: !Sub table/${InvitationsTable}/index/byEventId
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:index:WriteCapacityUnits
      ServiceNamespace: dynamodb

  InvitationsByEventIdIndexWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: invitations-byEventId-write
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref InvitationsByEventIdIndexWriteScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  TranslationsTableReadScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 200
      MinCapacity: 5
      ResourceId: !Sub table/${TranslationsTable}
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:table:ReadCapacityUnits
      ServiceNamespace: dynamodb

  TranslationsTableReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: translations-table-read
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref TranslationsTableReadScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  TranslationsTableWriteScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 50
      MinCapacity: 1
      ResourceId: !Sub table/${TranslationsTable}
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:table:WriteCapacityUnits
      ServiceNamespace: dynamodb

  TranslationsTableWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: translations-table-write
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref TranslationsTableWriteScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  TranslationsLanguageCodeIndexReadScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 200
      MinCapacity: 5
      ResourceId: !Sub table/${TranslationsTable}/index/LanguageCodeIndex
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:index:ReadCapacityUnits
      ServiceNamespace: dynamodb

  TranslationsLanguageCodeIndexReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: translations-LanguageCodeIndex-read
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref TranslationsLanguageCodeIndexReadScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  TranslationsLanguageCodeIndexWriteScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 50
      MinCapacity: 1
      ResourceId: !Sub table/${TranslationsTable}/index/LanguageCodeIndex
      RoleARN: !GetAtt DynamoDbAutoScalingRole.Arn
      ScalableDimension: dynamodb:index:WriteCapacityUnits
      ServiceNamespace: dynamodb

  TranslationsLanguageCodeIndexWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: translations-LanguageCodeIndex-write
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref TranslationsLanguageCodeIndexWriteScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  EventsCoversTempBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${StackPrefix}-${Environment}-events-covers-tmp
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-events-covers-tmp
        - Key: Environment
          Value: !Ref Environment
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: delete-old-previews
            Status: Enabled
            ExpirationInDays: 1

  EventsAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${StackPrefix}-${Environment}-events-assets
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-events-assets
        - Key: Environment
          Value: !Ref Environment
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  EventsPhotosBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - PhotoThumbnailsPermission
    Properties:
      BucketName: !Sub ${StackPrefix}-${Environment}-events-photos
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${Environment}-events-photos
        - Key: Environment
          Value: !Ref Environment
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:Put
            Function: !If
              - UsePhotoThumbnailsImageCond
              - !GetAtt PhotoThumbnailsFunctionImage.Arn
              - !GetAtt PhotoThumbnailsFunctionZip.Arn

  PhotosOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: EnablePhotosCdnCond
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${StackPrefix}-${Environment}-photos-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PhotosCdnPublicKey:
    Type: AWS::CloudFront::PublicKey
    Condition: EnablePhotosCdnCond
    Properties:
      PublicKeyConfig:
        CallerReference: !Sub ${StackPrefix}-${Environment}-${AWS::Region}-photos-public-key-${CdnPhotosSigningPublicKeyVersion}
        Name: !Sub ${StackPrefix}-${Environment}-photos-public-key-${CdnPhotosSigningPublicKeyVersion}
        EncodedKey: !Sub "{{resolve:ssm:${CdnPhotosSigningPublicKeySsmParamName}}}"
        Comment: !Sub ${StackPrefix}-${Environment} photos CDN signed URLs public key

  PhotosCdnKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Condition: EnablePhotosCdnCond
    Properties:
      KeyGroupConfig:
        Name: !Sub ${StackPrefix}-${Environment}-photos-key-group-${CdnPhotosSigningPublicKeyVersion}
        Comment: !Sub ${StackPrefix}-${Environment} photos CDN key group
        Items:
          - !Ref PhotosCdnPublicKey

  PhotosCdnResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: EnablePhotosCdnCond
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${StackPrefix}-${Environment}-photos-cors
        Comment: !Sub ${StackPrefix}-${Environment} photos CDN CORS policy
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - '*'
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowOrigins:
            Items:
              - https://appdev.ones.events
          OriginOverride: true

  PhotosDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: EnablePhotosCdnCond
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Origins:
          - Id: photosorigin
            DomainName: !GetAtt EventsPhotosBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref PhotosOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: photosorigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          TrustedKeyGroups:
            - !Ref PhotosCdnKeyGroup
          ResponseHeadersPolicyId: !Ref PhotosCdnResponseHeadersPolicy
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000

  EventsPhotosBucketPolicyForCdn:
    Type: AWS::S3::BucketPolicy
    Condition: EnablePhotosCdnCond
    Properties:
      Bucket: !Ref EventsPhotosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub ${EventsPhotosBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${PhotosDistribution}

