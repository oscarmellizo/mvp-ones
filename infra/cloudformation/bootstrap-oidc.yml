AWSTemplateFormatVersion: '2010-09-09'
Description: Ones MVP - GitHub Actions OIDC bootstrap (provider + deploy role)

Parameters:
  GitHubOrg:
    Type: String
    Default: oscarmellizo
  GitHubRepo:
    Type: String
    Default: mvp-ones
  GitHubBranch:
    Type: String
    Default: main

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stage
      - prod
  RoleName:
    Type: String
    Default: ones-github-actions-deploy-role

  ExistingOidcProviderArn:
    Type: String
    Default: ''

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingOidcProviderArn, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${RoleName}-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action:
              - sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${Environment}"
      Policies:
        - PolicyName: ones-github-actions-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:Describe*
                  - cloudformation:Get*
                  - cloudformation:List*
                  - cloudformation:ValidateTemplate
                Resource: '*'

              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:TagResource
                  - apigateway:UntagResource
                  - apigateway:ListTagsForResource
                Resource:
                  - arn:aws:apigateway:*::/apis*
                  - arn:aws:apigateway:*::/tags*

              - Sid: S3
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketCors
                  - s3:GetBucketCors
                  - s3:PutBucketTagging
                  - s3:PutLifecycleConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:PutObjectAcl
                  - s3:TagResource
                Resource: '*'

              - Sid: CloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:ListDistributions
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:ListInvalidations
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicyConfig
                  - cloudfront:ListResponseHeadersPolicies
                  - cloudfront:CreatePublicKey
                  - cloudfront:UpdatePublicKey
                  - cloudfront:DeletePublicKey
                  - cloudfront:GetPublicKey
                  - cloudfront:GetPublicKeyConfig
                  - cloudfront:ListPublicKeys
                  - cloudfront:CreateKeyGroup
                  - cloudfront:UpdateKeyGroup
                  - cloudfront:DeleteKeyGroup
                  - cloudfront:GetKeyGroup
                  - cloudfront:GetKeyGroupConfig
                  - cloudfront:ListKeyGroups
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:ListOriginAccessControls
                  - cloudfront:CreateFunction
                  - cloudfront:UpdateFunction
                  - cloudfront:DescribeFunction
                  - cloudfront:GetFunction
                  - cloudfront:PublishFunction
                  - cloudfront:TestFunction
                  - cloudfront:DeleteFunction
                  - cloudfront:ListFunctions
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                Resource: '*'

              - Sid: WAFv2
                Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:UpdateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:GetWebACL
                  - wafv2:ListWebACLs
                  - wafv2:AssociateWebACL
                  - wafv2:DisassociateWebACL
                  - wafv2:GetWebACLForResource
                  - wafv2:ListResourcesForWebACL
                  - wafv2:TagResource
                  - wafv2:UntagResource
                  - wafv2:ListTagsForResource
                Resource: '*'

              - Sid: ECR
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:TagResource
                  - ecr:UntagResource
                  - ecr:PutImageScanningConfiguration
                  - ecr:GetLifecyclePolicy
                  - ecr:PutLifecyclePolicy
                  - ecr:DeleteLifecyclePolicy
                  - ecr:ListImages
                  - ecr:BatchDeleteImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetAuthorizationToken
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:SetRepositoryPolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:DeleteRepositoryPolicy
                Resource: '*'

              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:DescribeMetricFilters
                  - logs:PutMetricFilter
                  - logs:DeleteMetricFilter
                  - logs:PutRetentionPolicy
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:TagResource
                  - logs:UntagResource
                Resource: '*'

              - Sid: SSM
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:DeleteParameter
                Resource: '*'

              - Sid: ECSAndELB
                Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:DeleteCluster
                  - ecs:Describe*
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:List*
                  - ecs:TagResource
                  - ecs:UntagResource
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:CreateRule
                  - elasticloadbalancing:Modify*
                  - elasticloadbalancing:Describe*
                  - elasticloadbalancing:Delete*
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:RemoveTags
                  - ec2:Describe*
                  - ec2:GetSecurityGroupsForVpc
                  - ec2:CreateSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:DeleteSecurityGroup
                  - ec2:CreateVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:DeleteVpc
                  - ec2:CreateSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:DeleteSubnet
                  - ec2:CreateInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: '*'

              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:ListTables
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource: '*'

              - Sid: CloudWatch
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmsForMetric
                  - cloudwatch:DescribeAlarmHistory
                  - cloudwatch:SetAlarmState
                  - cloudwatch:PutAnomalyDetector
                  - cloudwatch:DeleteAnomalyDetector
                  - cloudwatch:DescribeAnomalyDetectors
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource: '*'

              - Sid: ApplicationAutoScaling
                Effect: Allow
                Action:
                  - application-autoscaling:RegisterScalableTarget
                  - application-autoscaling:DeregisterScalableTarget
                  - application-autoscaling:PutScalingPolicy
                  - application-autoscaling:DeleteScalingPolicy
                  - application-autoscaling:Describe*
                  - application-autoscaling:List*
                  - application-autoscaling:TagResource
                  - application-autoscaling:UntagResource
                Resource: '*'

              - Sid: SecretsManager
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:GetRandomPassword
                  - secretsmanager:UpdateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:DeleteSecret
                  - secretsmanager:ListSecrets
                Resource: '*'

              - Sid: SES
                Effect: Allow
                Action:
                  - ses:CreateEmailIdentity
                  - ses:DeleteEmailIdentity
                  - ses:GetEmailIdentity
                  - ses:ListEmailIdentities
                  - ses:PutEmailIdentityDkimAttributes
                  - ses:PutEmailIdentityMailFromAttributes
                  - ses:PutEmailIdentityFeedbackAttributes
                  - ses:TagResource
                  - ses:UntagResource
                  - ses:ListTagsForResource
                Resource: '*'

              - Sid: SNS
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:ListTopics
                  - sns:TagResource
                  - sns:UntagResource
                Resource: '*'

              - Sid: AmazonManagedPrometheus
                Effect: Allow
                Action:
                  - aps:CreateWorkspace
                  - aps:DeleteWorkspace
                  - aps:DescribeWorkspace
                  - aps:DescribeWorkspaceConfiguration
                  - aps:DescribeAlertManagerDefinition
                  - aps:DescribeLoggingConfiguration
                  - aps:DescribeQueryLoggingConfiguration
                  - aps:DescribeRuleGroupsNamespace
                  - aps:ListWorkspaces
                  - aps:ListRuleGroupsNamespaces
                  - aps:ListScrapers
                  - aps:TagResource
                  - aps:UntagResource
                  - aps:ListTagsForResource
                Resource: '*'

              - Sid: Lambda
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:InvokeFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:ListVersionsByFunction
                  - lambda:GetLayerVersion
                  - lambda:ListLayers
                  - lambda:ListLayerVersions
                Resource: '*'

              - Sid: IAMForEcsTasks
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                Resource: '*'

              - Sid: IAMServiceLinkedRoles
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - elasticloadbalancing.amazonaws.com
                      - ecs.amazonaws.com

Outputs:
  GitHubActionsDeployRoleArn:
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Export:
      Name: !Sub ones-github-actions-deploy-role-arn-${Environment}
